# ══════════════════════════════════════════════════════════════════════════════
#  CURIOSITY ENGINE — configurazione
#  Tutto quello che definisce la personalità della pagina sta qui dentro.
#  Cambia questo file, non il codice.
# ══════════════════════════════════════════════════════════════════════════════

brand:
  handle: "@oddlywireddaily"
  name: "Oddly Wired"
  # Firma in basso a destra su ogni slide. Tenere corta.
  watermark: "@oddlywireddaily"
  # Contatto inserito nello User-Agent verso Wikimedia Commons: la loro policy
  # lo richiede e senza throttlano le richieste. Una email o un URL vanno bene.
  contact: "https://instagram.com/oddlywireddaily"
  # Le due destinazioni, usate per rimandare l'una all'altra. Chi arriva da uno
  # Short deve poter trovare il profilo Instagram e viceversa: sono due
  # pubblici diversi, e senza un rimando esplicito restano due pagine separate
  # con lo stesso nome invece che una sola con due porte d'ingresso.
  youtube: "@OddlyWiredDaily"

# ─── NICCHIA ──────────────────────────────────────────────────────────────────
# Determina il prompt di generazione. Più è stretta, più l'algoritmo profila
# bene il pubblico e più cresci. "Mix generalista" = crescita lenta.
niche:
  slug: "psychology_and_human_behavior"
  label: "Psychology & human behaviour"
  brief: |
    Counter-intuitive facts about how the human mind and human behaviour
    actually work: cognitive biases, memory, perception, social dynamics,
    decision-making, sleep, attention, emotion.
    The reader should finish the post thinking "wait, that explains something
    about me". Prefer facts with a personal hook over abstract lab trivia.
  # Argomenti da evitare: rumore, contenuti già saturi, o rischiosi.
  avoid:
    - "generic motivational advice"
    - "astrology, MBTI, or other unfalsifiable typologies"
    - "medical advice or anything a reader might act on health-wise"
    - "the marshmallow test, the Stanford prison experiment, the Dunning-Kruger
       effect stated as 'stupid people think they're smart' (all overused
       and/or misreported)"

# ─── VOCE EDITORIALE ──────────────────────────────────────────────────────────
voice:
  language: "en-US"
  # Come suona la pagina. Questo va nel system prompt.
  guide: |
    Calm, precise, quietly confident. You are the friend who reads the actual
    study, not the account that shouts.
    - No hype words: "mind-blowing", "insane", "you won't believe", "shocking".
    - No emoji in the image text. Sparingly (0-1) in the caption.
    - Short declarative sentences. Concrete nouns. Active voice.
    - Numbers are specific: "in a 2019 study of 1,300 adults", not "studies show".
    - Never claim more than the evidence supports. "Suggests" beats "proves".
    - The hook is a statement or a question, never a command.

# ─── FORMATO ──────────────────────────────────────────────────────────────────
format:
  # "carousel" (5 slide, più salvataggi/condivisioni) | "single" (1 immagine)
  # In modalità mix, la pipeline alterna secondo il rapporto qui sotto.
  mode: "carousel"
  mix_ratio_carousel: 0.6         # usato solo se mode: "mix"
  carousel_slides: 5
  width: 1080
  height: 1350                    # 4:5 — occupa più schermo nel feed IG

  # Template — vedi engine/templates/. I primi tre sono solo tipografia,
  # gli ultimi tre usano una foto pertinente al fatto.
  #   editorial  serif su fondo scuro, da rivista
  #   bold       carta avorio, grottesco pesante, massima leggibilità
  #   mono       scheda tecnica, griglia, monospace
  #   photo      foto a tutto campo in duotone, testo in basso
  #   split      foto sopra, testo sotto su fondo pieno — il più leggibile
  #   frame      stampa incorniciata su carta chiara, didascalia da museo
  # split è il più adatto alle immagini generate gratuitamente: la foto occupa
  # metà slide, quindi l'ingrandimento dei 686×858 di Pollinations non si vede.
  template: "impact"

  # Con `true` ogni slide ottiene un'immagine pertinente. Richiesto dai template
  # photo/split/frame; ignorato dagli altri tre, che non hanno dove metterla.
  use_images: true

# ─── IMMAGINI ─────────────────────────────────────────────────────────────────
visuals:
  # Generazione AI. Claude NON genera immagini: serve un provider dedicato.
  #
  # GRATUITI
  #   pollinations  nessuna chiave, nessun account. Esce a 686×858 qualunque
  #                 dimensione chiedi, quindi c'è un ingrandimento sulle slide;
  #                 su sfondo desaturato si nota poco. Servizio pubblico: da
  #                 considerare "spesso disponibile", non garantito.
  #   cloudflare    FLUX.1-schnell sul free tier di Workers AI (10.000 neuroni
  #                 al giorno, a questi volumi inesauribili). Qualità e
  #                 risoluzione migliori. Serve un account gratuito:
  #                 CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN.
  #
  # A PAGAMENTO
  #   gemini  gemini-3.1-flash-lite-image — richiede fatturazione attiva sul
  #           progetto Google: i modelli immagine hanno free tier ZERO.
  #   openai  gpt-image-2 — ~$0.005-0.02/immagine a qualità "low"
  #   imagen  ⚠️ tutti gli imagen-4.* sono dismessi per i nuovi progetti (404)
  #
  #   none    nessuna generazione: le immagini arrivano solo da Wikimedia/Pexels
  ai_provider: "cloudflare"

  # true  → genera sempre, anche per i soggetti "reali". Giusto per nicchie di
  #         comportamento quotidiano: l'archivio su questi temi restituisce
  #         materiale storico fuori contesto.
  # false → cerca prima in archivio per i soggetti reali. Giusto per storia,
  #         scienza, eventi: lì la foto autentica vale più di una generata.
  prefer_generated: true

  # Passi di generazione (solo cloudflare/FLUX).
  # ⚠️ Cloudflare accetta al massimo 8 per flux-1-schnell: valori superiori
  # fanno fallire ogni immagine con un 400. Verificato il 10 agosto 2026.
  # Il codice limita comunque a 8, ma non alzarlo qui pensando di guadagnarci.
  # Su questo modello la qualità si migliora dal prompt, non dai passi.
  steps: 8
  ai_model: ""            # vuoto = default del provider
  ai_quality: "low"       # solo openai: low | medium | high

  # Lo stile viene accodato a ogni prompt. È la ragione per cui venti immagini
  # generate in giorni diversi sembrano la stessa pagina invece di venti post
  # scollegati. Cambialo per cambiare il carattere visivo dell'account.
  # Le istruzioni negative pesano di più all'inizio del prompt: FLUX tende a
  # inventare insegne e scritte illeggibili, e metterle in fondo non basta.
  # Anche così qualche artefatto passa — è un limite del modello, non del
  # prompt: nel dubbio preferire soggetti senza cartelli (interni, primi piani).
  ai_style: >
    Absolutely no text, no letters, no signage, no shop signs, no posters, no
    numbers, no watermarks anywhere in the frame.
    Editorial documentary photograph, natural available light, muted desaturated
    palette, shallow depth of field, 50mm lens, subtle film grain, quiet and
    restrained composition with generous negative space.
    No people looking at the camera.

  # Tetto di immagini GENERATE per post — vale solo per quelle a pagamento.
  # Le immagini cercate (Wikimedia, Pexels) sono gratuite e non sono contate,
  # quindi con ai_provider: "none" questo valore non limita nulla.
  # 5 slide × 2 post/giorno = 300 immagini/mese: a $0.02 sono ~6 $/mese.
  # Esaurito il tetto, le slide concettuali ripiegano sulla ricerca.
  # Con un provider gratuito non c'è motivo di limitarla: ogni slide che non
  # ottiene un'immagine è un buco nel carosello. Alzalo solo se passi a un
  # provider a pagamento.
  max_ai_images_per_post: 5

  # ⚠️ Le immagini reperite sono filtrate per licenza (solo pubblico dominio,
  # CC0, CC BY, CC BY-SA) e il credito viene stampato sulla slide.
  # Quelle generate sono etichettate come illustrazione: sia Instagram che
  # TikTok richiedono di dichiarare i contenuti sintetici.

# ─── PIPELINE ─────────────────────────────────────────────────────────────────
pipeline:
  # Motore di generazione testo.
  #   anthropic  Claude. Nettamente migliore nel ruolo critico — il fact-check
  #              ostile che smonta le curiosità false prima che le pubblichi.
  #              Richiede credito a consumo (~0,10-0,25 $ a post).
  #   gemini     Google. Free tier vero sui modelli di TESTO. Qualità
  #              inferiore, ma fa girare tutto a costo zero.
  provider: "gemini"

  # Deve corrispondere al provider:
  #   anthropic → claude-opus-5 (o claude-sonnet-5, più economico)
  #   gemini    → gemini-3.5-flash | gemini-2.5-flash | gemini-3.1-flash-lite
  # Nota: ogni modello ha la sua quota giornaliera indipendente. Se esaurisci
  # quella di uno, cambiare modello qui riparte subito senza aspettare.
  model: "gemini-3.1-flash-lite"

  # Come si verificano i fatti.
  #   native     il modello cerca da solo. Su Anthropic è incluso; su Google
  #              il grounding richiede fatturazione attiva (free tier zero).
  #   wikipedia  si portano al modello gli estratti di Wikipedia. Gratis,
  #              nessuna chiave. Non è una fonte primaria e non copre tutto,
  #              ma intercetta le attribuzioni sbagliate e i numeri derivati,
  #              che sono il grosso delle curiosità false in circolazione.
  #   none       nessuna fonte esterna: sconsigliato, il fact-check diventa
  #              una seconda opinione dello stesso modello.
  web_search: "wikipedia"

  # Solo Gemini: tetto ai token di ragionamento. Su Gemini il ragionamento
  # consuma lo stesso budget della risposta, quindi senza limite il JSON viene
  # troncato a metà. Alzarlo migliora il giudizio ma aumenta il rischio.
  thinking_budget: 2048
  # Quante idee generare per batch. Se ne scarti molte in verifica, alza.
  ideas_per_batch: 16

  # Scorte minime per canale, sotto le quali il ciclo genera. Il fabbisogno
  # giornaliero è di 5 curiosità su Instagram (2 caroselli + 3 reel) e 9 su
  # YouTube (3 video da 3): questi valori tengono circa un giorno di margine.
  # I due registri sono separati, quindi la stessa curiosità può servire
  # entrambi i canali — ma mai due volte lo stesso.
  buffer_instagram: 10
  buffer_youtube: 12

  # Tetto di generazioni per singolo giro. La generazione è l'unico punto che
  # può consumare quota senza un limite naturale: se il fact-check bocciasse
  # tutto, senza tetto girerebbe finché non finisce la quota giornaliera.
  max_batches_per_run: 2
  # Soglia minima di confidenza per pubblicare. 0.85 è severo di proposito:
  # una pagina di curiosità che posta bufale viene distrutta nei commenti.
  # Abbassato da 0.85 a 0.75 il 10 agosto, insieme alla revisione del
  # fact-check. Prima il verificatore rispondeva 0.95-0.99 a tutto e la soglia
  # non filtrava nulla; ora la scala è calibrata sul serio e un fatto ben
  # documentato si assesta fra 0.80 e 0.94. Con 0.85 verrebbero scartate anche
  # curiosità vere e ben sostenute.
  min_confidence: 0.75
  # Similarità massima con un post già pubblicato (0-1). Sopra → scartato.
  max_similarity: 0.55
  # Post al giorno. IG tollera fino a 25-50 via API ma 1-2 è il ritmo giusto
  # per una pagina nuova: l'algoritmo premia la costanza, non il volume.
  posts_per_day: 2
  # Ore locali di pubblicazione (24h).
  post_hours: [13, 20]
  timezone: "Europe/Amsterdam"

# ─── APPROVAZIONE UMANA ───────────────────────────────────────────────────────
# Con `require_approval: true` la pipeline si ferma prima di pubblicare e ti
# manda il post su Telegram con i bottoni Approva/Scarta.
# Consigliato ON per le prime 2-4 settimane: è il modo più economico di
# scoprire cosa sbaglia il generatore prima che lo veda il pubblico.
  # Tre modalità:
  #   auto     pubblica subito, nessun avviso. Massima automazione, zero
  #            controllo.
  #   veto     ti manda il post su Telegram e aspetta `veto_minutes`. Se non
  #            dici niente esce; se rispondi /no viene bloccato. Automatico di
  #            default, fermabile — nessuna approvazione richiesta.
  #   approval non pubblica finché non approvi. Se Telegram non è configurato
  #            i post restano bloccati per sempre: usare solo con Telegram.
  mode: "auto"

  # Solo per mode: veto. Quanto aspettare prima di pubblicare.
  # Attenzione al costo su GitHub Actions: il job resta acceso ad aspettare.
  # 10 minuti × 2 post/giorno × 30 = 600 minuti/mese sui 2000 gratuiti.
  veto_minutes: 10

  # Compatibilità: se `mode` non è impostato si ricade su questo.
  require_approval: false
  channel: "telegram"             # telegram | none

# ─── PUBBLICAZIONE ────────────────────────────────────────────────────────────
publish:
  instagram:
    enabled: true
  youtube:
    # Verificato con un caricamento reale l'11 agosto 2026.
    # Quota: 6 caricamenti al giorno — ai 3 reel attuali sta larga.
    enabled: true
    # true = YouTube riceve la variante da ~33 secondi con tre curiosita',
    # dentro la finestra 30-45s che la piattaforma premia. Instagram continua
    # a ricevere il formato breve, che e' quello che funziona li'.
    # false = stesso video su entrambe (piu' semplice, meno efficace su YT).
    long_form: true
    # Quante curiosita' in fila nel video lungo. A ~11 secondi l'una, 3 danno
    # ~33 secondi. Sotto i 30 il video esce dalla finestra che YouTube premia,
    # sopra i 45 la percentuale di visione crolla.
    facts_per_video: 3
    # Tetto di video al giorno. Non è la quota API (sei caricamenti al giorno,
    # ne servono tre): oltre i due-tre Short quotidiani la spinta per video
    # cala, perché ognuno viene provato su un piccolo pubblico prima di essere
    # distribuito e pubblicarne troppi significa togliersi spazio da soli.
    max_per_day: 3
    # Quanto deve restare ferma una curiosità prima di poter tornare come
    # spalla in un altro video. Senza, quella appena uscita ricompare nel
    # video successivo al proprio: chi guarda due Short di fila vede due
    # volte la stessa cosa, ed è il modo più veloce per sembrare una pagina
    # che ricicla. Si allarga da sé se l'archivio è ancora troppo corto.
    reuse_cooldown_hours: 48

  tiktok:
    # I video NON si pubblicano da soli, e non è una limitazione tecnica che
    # si può aggirare: l'API può solo depositare bozze nell'inbox dell'app,
    # mentre il programmatore di TikTok sta in TikTok Studio (desktop). Sono
    # due percorsi che non si incontrano — una bozza nell'inbox non la puoi
    # passare a Studio. Quindi si salta l'API del tutto: `run.py tiktok`
    # prepara i file, tu li trascini in Studio e li programmi in un colpo.
    # Vantaggio collaterale: niente app sviluppatore, niente audit di 2-4
    # settimane, niente verifica del dominio.
    enabled: true

    # Quanti video prepara ogni volta. Studio programma fino a 10 giorni
    # avanti (non 30: quelli sono gli scheduler esterni), quindi un lotto da
    # 20 copre dieci giorni a due al giorno.
    batch: 20

    # Quattro curiosità per video. Su TikTok i contenuti che spiegano qualcosa
    # rendono meglio fra i 42 e i 54 secondi — più larga della finestra di
    # YouTube (30-45) e molto più di quella di Instagram (7-15). Quattro per
    # ~11 secondi l'una centrano i 45.
    facts_per_video: 4
    target_seconds: 45.0

    # Non serve generare curiosità apposta: il registro dei consumi è per
    # canale, e su TikTok non è mai uscito nulla. Tutto l'archivio è materiale
    # nuovo per quel pubblico — è cross-posting, non riciclo.
    max_per_day: 2

    # Tetto di TikTok, non nostro: cinque bozze pendenti ogni 24 ore, scritto
    # nella loro documentazione. Il ciclo si ferma da sé quando lo tocca,
    # senza trattarlo come un errore — è il ritmo previsto, non un guasto.
    max_bozze_al_giorno: 5

# ─── COMMENTI ─────────────────────────────────────────────────────────────────
# Rispondere entro la prima ora è il segnale più forte dopo i salvataggi, e
# ogni risposta riporta la persona sul post.
comments:
  # true = le risposte passano da Telegram prima di uscire.
  # false = escono da sole, TRANNE quelle che il modello marca come da leggere
  #         a un umano: correzioni, cose mediche, confidenze personali. Quelle
  #         restano senza risposta, che è l'esito giusto — se qualcuno segnala
  #         un errore vero, una risposta automatica che difende il post fa più
  #         danno di dieci risposte mancate.
  #
  # Sta su false perché non c'è nessuno in ascolto: Telegram non è configurato,
  # e con true le risposte si accumulavano in coda senza che nessuno potesse
  # approvarle. Meglio rispondere alle domande facili e tacere sul resto.
  require_approval: false
  # Quanto indietro guardare. Sui post più vecchi i commenti arrivano col
  # contagocce e interrogarli brucia il rate limit per niente.
  window_hours: 48

  # Tetto di risposte per giro. Un account che risponde a TUTTI, sempre, è
  # riconoscibile come automatico quanto uno che risponde male: le persone
  # vere rispondono a una parte dei commenti, non a tutti. Le correzioni non
  # rientrano nel tetto — quelle vanno sempre gestite.
  max_replies_per_run: 6

  # Tetto sulle ANALISI, che è cosa diversa dal tetto sulle risposte: ogni
  # commento nuovo costa una chiamata al modello *prima* che si decida se
  # rispondere. Con un video che gira, trecento commenti sarebbero trecento
  # chiamate in un giro solo — sulla stessa quota che serve a generare le
  # curiosità. Quelli oltre il tetto restano nuovi e toccano al giro dopo.
  max_drafts_per_run: 20

caption:
  max_chars: 900
  hashtag_count: 12
  # Hashtag fissi sempre presenti (brand). Il resto li genera Claude sul tema.
  pinned_hashtags: ["psychologyfacts", "humanbehaviour"]
  cta: "Follow @oddlywireddaily for one a day."

  # Rimando al canale YouTube, accodato alla didascalia prima degli hashtag.
  # Instagram non rende cliccabili i link in didascalia: va scritto in modo
  # che si possa cercare a mano, quindi il nome del canale e non un URL lungo.
  # Il link vero e proprio va messo in bio — quello sì cliccabile — e la bio
  # non è modificabile da API, quindi resta l'unica cosa da fare a mano.
  # Svuotare la stringa per toglierlo.
  cross_promo: "More on YouTube: @OddlyWiredDaily"

  # Dichiarazione dei contenuti sintetici. Obbligatoria in UE dal 2 agosto 2026
  # (AI Act, art. 50): deve essere percepibile senza strumenti tecnici e al
  # primo contatto. Sulle slide il credito è già stampato; questa riga copre
  # chi legge solo la caption. Svuotare la stringa la disattiva — sconsigliato.
  # La seconda frase non è difensiva: distingue l'illustrazione, che è
  # generata, dal fatto, che è verificato. È il contrario di quello che fanno
  # le pagine che nascondono l'uso dell'AI.
  # Disattivata di scelta: la dichiarazione è già data due volte — il credito
  # "Illustration: AI-generated" stampato su ogni slide, e l'etichetta
  # "AI creator" attivata sul profilo Instagram. Ripeterla in caption sarebbe
  # ridondante. Riattivare mettendo una stringa qui se le regole cambiano.
  ai_disclosure: ""

# ─── REEL ─────────────────────────────────────────────────────────────────────
# Flusso separato dai caroselli: cadenza diversa, tempi diversi, guasti
# diversi. Se i video si rompono, i post continuano a uscire.
reel:
  # 9 secondi: la finestra 7-15s ha i tassi di completamento e di replica piu'
  # alti. Sotto i 7 il video finisce prima che l'algoritmo registri una
  # visione piena; sopra i 15 le repliche crollano.
  line_seconds: 9.0
  batch: 2                # quante frasi generare per volta
  # Coda volutamente minima: un magazzino grande invecchia. Ogni miglioria al
  # generatore rende peggiori i reel gia' in attesa, che usciranno comunque.
  min_queue: 1
  reveal_at: 3.4          # secondo in cui l'aggancio lascia il posto alla risposta
  # Quota di reel a frase singola (senza rivelazione). Alternare i due formati
  # evita che il profilo diventi prevedibile: chi vede sempre lo stesso schema
  # smette di aspettare la seconda parte.
  single_ratio: 0.4
  # Sotto questa soglia di curiosità non ancora usate nei reel, il ciclo ne
  # genera di nuove. Senza, i reel si esaurirebbero in circa una settimana
  # perché consumano fatti ma non ne producono.
  min_facts: 6
  # ─── Variante lunga per YouTube ────────────────────────────────────────────
  # Su Instagram resta il formato breve, che è quello che funziona lì; YouTube
  # riceve più curiosità in fila. Durata complessiva del video: la finestra
  # premiata è 30-45 secondi — sotto i 30 il video viene trattato come uno
  # scarto, sopra i 45 la percentuale di visione crolla e con lei la spinta.
  # Correzione colore applicata a ogni filmato di sfondo. Le clip di stock
  # arrivano da fonti diverse e non hanno nulla in comune: senza, una notturna
  # desaturata e una al neon rosa finiscono nello stesso video e la seconda non
  # sembra della stessa pagina. Su un profilo il colore è metà del riconoscimento.
  grade_saturation: 0.45
  # Comprime solo le luci alte, lasciando i neri dove sono. Abbassare la
  # luminosità di una quantità fissa spegnerebbe le clip già scure — misurato:
  # una notturna passava da 18 a 5 di luminosità media, cioè nero.
  grade_highlights: true

  long_target_seconds: 33.0
  # Tetto per singola curiosità: la durata di ciascuna si ricava dividendo il
  # totale, ma con poche curiosità in archivio la divisione darebbe segmenti
  # lunghissimi con una frase ferma sullo schermo.
  long_max_seconds_per_fact: 16.0
