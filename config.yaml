# ══════════════════════════════════════════════════════════════════════════════
#  CURIOSITY ENGINE — configurazione
#  Tutto quello che definisce la personalità della pagina sta qui dentro.
#  Cambia questo file, non il codice.
# ══════════════════════════════════════════════════════════════════════════════

brand:
  handle: "@oddlywireddaily"
  name: "Oddly Wired"
  # Firma in basso a destra su ogni slide. Tenere corta.
  watermark: "@oddlywireddaily"
  # Contatto inserito nello User-Agent verso Wikimedia Commons: la loro policy
  # lo richiede e senza throttlano le richieste. Una email o un URL vanno bene.
  contact: "https://instagram.com/oddlywireddaily"
  # Le due destinazioni, usate per rimandare l'una all'altra. Chi arriva da uno
  # Short deve poter trovare il profilo Instagram e viceversa: sono due
  # pubblici diversi, e senza un rimando esplicito restano due pagine separate
  # con lo stesso nome invece che una sola con due porte d'ingresso.
  youtube: "@OddlyWiredDaily"

  # Gli altri due canali attivi. Compaiono sul sito — barra in alto, piè di
  # pagina e i riquadri in fondo alle pagine — solo se questi campi sono
  # pieni: chi arriva da uno Short deve poter trovare gli altri posti, e
  # finché un canale non esiste il collegamento non viene emesso affatto.
  #
  # Bluesky vuole l'handle intero, dominio compreso, perché l'indirizzo del
  # profilo è bsky.app/profile/<handle> e senza il dominio non risolve.
  tiktok: "@oddlywireddaily"
  bluesky: "oddlywireddaily.bsky.social"

# ─── NICCHIA ──────────────────────────────────────────────────────────────────
# Determina il prompt di generazione. Più è stretta, più l'algoritmo profila
# bene il pubblico e più cresci. "Mix generalista" = crescita lenta.
niche:
  slug: "psychology_and_human_behavior"
  label: "Psychology & human behaviour"
  brief: |
    Counter-intuitive facts about how the human mind and human behaviour
    actually work: cognitive biases, memory, perception, social dynamics,
    decision-making, sleep, attention, emotion.
    The reader should finish the post thinking "wait, that explains something
    about me". Prefer facts with a personal hook over abstract lab trivia.
  # Argomenti da evitare: rumore, contenuti già saturi, o rischiosi.
  avoid:
    - "generic motivational advice"
    - "astrology, MBTI, or other unfalsifiable typologies"
    - "medical advice or anything a reader might act on health-wise"
    - "the marshmallow test, the Stanford prison experiment, the Dunning-Kruger
       effect stated as 'stupid people think they're smart' (all overused
       and/or misreported)"

# ─── VOCE EDITORIALE ──────────────────────────────────────────────────────────
voice:
  language: "en-US"
  # Come suona la pagina. Questo va nel system prompt.
  guide: |
    Calm, precise, quietly confident. You are the friend who reads the actual
    study, not the account that shouts.
    - No hype words: "mind-blowing", "insane", "you won't believe", "shocking".
    - No emoji in the image text. Sparingly (0-1) in the caption.
    - Short declarative sentences. Concrete nouns. Active voice.
    - Numbers are specific: "in a 2019 study of 1,300 adults", not "studies show".
    - Never claim more than the evidence supports. "Suggests" beats "proves".
    - The hook is a statement or a question, never a command.

# ─── FORMATO ──────────────────────────────────────────────────────────────────
format:
  # "carousel" (5 slide, più salvataggi/condivisioni) | "single" (1 immagine)
  # In modalità mix, la pipeline alterna secondo il rapporto qui sotto.
  mode: "carousel"
  mix_ratio_carousel: 0.6         # usato solo se mode: "mix"
  carousel_slides: 5
  width: 1080
  height: 1350                    # 4:5 — occupa più schermo nel feed IG

  # Template — vedi engine/templates/. I primi tre sono solo tipografia,
  # gli ultimi tre usano una foto pertinente al fatto.
  #   editorial  serif su fondo scuro, da rivista
  #   bold       carta avorio, grottesco pesante, massima leggibilità
  #   mono       scheda tecnica, griglia, monospace
  #   photo      foto a tutto campo in duotone, testo in basso
  #   split      foto sopra, testo sotto su fondo pieno — il più leggibile
  #   frame      stampa incorniciata su carta chiara, didascalia da museo
  # split è il più adatto alle immagini generate gratuitamente: la foto occupa
  # metà slide, quindi l'ingrandimento dei 686×858 di Pollinations non si vede.
  template: "impact"

  # Con `true` ogni slide ottiene un'immagine pertinente. Richiesto dai template
  # photo/split/frame; ignorato dagli altri tre, che non hanno dove metterla.
  use_images: true

# ─── IMMAGINI ─────────────────────────────────────────────────────────────────
visuals:
  # Generazione AI. Claude NON genera immagini: serve un provider dedicato.
  #
  # GRATUITI
  #   pollinations  nessuna chiave, nessun account. Esce a 686×858 qualunque
  #                 dimensione chiedi, quindi c'è un ingrandimento sulle slide;
  #                 su sfondo desaturato si nota poco. Servizio pubblico: da
  #                 considerare "spesso disponibile", non garantito.
  #   cloudflare    FLUX.1-schnell sul free tier di Workers AI (10.000 neuroni
  #                 al giorno, a questi volumi inesauribili). Qualità e
  #                 risoluzione migliori. Serve un account gratuito:
  #                 CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN.
  #
  # A PAGAMENTO
  #   gemini  gemini-3.1-flash-lite-image — richiede fatturazione attiva sul
  #           progetto Google: i modelli immagine hanno free tier ZERO.
  #   openai  gpt-image-2 — ~$0.005-0.02/immagine a qualità "low"
  #   imagen  ⚠️ tutti gli imagen-4.* sono dismessi per i nuovi progetti (404)
  #
  #   none    nessuna generazione: le immagini arrivano solo da Wikimedia/Pexels
  ai_provider: "cloudflare"

  # Secondo provider, usato solo se il primo non produce nulla. Serve perché
  # il margine su Cloudflare è sottile: 10.000 neuroni al giorno coprono
  # giusto le dieci immagini dei due caroselli, e una prova in più esaurisce
  # la quota. Senza questa rete si ripiegherebbe sulla ricerca stock, che su
  # questa nicchia restituisce repertorio fuori tema — cioè esattamente il
  # motivo per cui prefer_generated è acceso.
  # "none" per disattivarla.
  ai_fallback: "pollinations"

  # true  → genera sempre, anche per i soggetti "reali". Giusto per nicchie di
  #         comportamento quotidiano: l'archivio su questi temi restituisce
  #         materiale storico fuori contesto.
  # false → cerca prima in archivio per i soggetti reali. Giusto per storia,
  #         scienza, eventi: lì la foto autentica vale più di una generata.
  prefer_generated: true

  # Passi di generazione (solo cloudflare/FLUX).
  # ⚠️ Cloudflare accetta al massimo 8 per flux-1-schnell: valori superiori
  # fanno fallire ogni immagine con un 400. Verificato il 10 agosto 2026.
  # Il codice limita comunque a 8, ma non alzarlo qui pensando di guadagnarci.
  # Su questo modello la qualità si migliora dal prompt, non dai passi.
  steps: 8
  ai_model: ""            # vuoto = default del provider (o la rotazione qui sotto)
  ai_quality: "low"       # solo openai: low | medium | high

  # I modelli Cloudflare in rotazione. Tutti e tre sullo stesso free tier di
  # Workers AI, tutti e tre scelti da Mattia il 3 settembre 2026 guardando la
  # stessa immagine generata dai tre ("belle tutte e tre, alterniamole").
  #
  # LA ROTAZIONE È PER GIORNO, non per slide. Un carosello con cinque slide
  # uscite da tre modelli diversi non sembra vario, sembra sbagliato: lo stile
  # cambierebbe dentro lo stesso post, che è l'unico posto in cui la coerenza
  # serve davvero. Così ogni post resta uniforme al suo interno e a variare è
  # il profilo visto dall'alto, che è dove la monotonia si nota.
  #
  # ⚠️ NON accettano lo stesso corpo, e il codice lo tiene in conto — se ne
  # aggiungi uno, controlla prima quale forma vuole. Misurato il 3/9/2026:
  #   flux-1-schnell   rifiuta width/height, vuole steps → 1024x1024
  #   lucid-origin     accetta width/height, niente steps → 1080x1350
  #   phoenix-1.0      accetta width/height, niente steps → 1080x1350
  # Sbagliare il corpo non dà un errore visibile: Cloudflare risponde 400 e la
  # catena ripiega su pollinations, che è peggiore. Si vede come "ogni tanto
  # le immagini escono brutte", ed è il guasto più difficile da riconoscere.
  cloudflare_modelli:
    - "@cf/black-forest-labs/flux-1-schnell"
    - "@cf/leonardo/lucid-origin"
    - "@cf/leonardo/phoenix-1.0"

  # Dimensioni chieste ai modelli che le accettano. 1080x1350 è il 4:5 pieno
  # di Instagram: chiedendolo nativamente il ritaglio non toglie più niente.
  larghezza: 1080
  altezza: 1350

  # Lo stile viene accodato a ogni prompt. È la ragione per cui venti immagini
  # generate in giorni diversi sembrano la stessa pagina invece di venti post
  # scollegati. Cambialo per cambiare il carattere visivo dell'account.
  # Le istruzioni negative pesano di più all'inizio del prompt: FLUX tende a
  # inventare insegne e scritte illeggibili, e metterle in fondo non basta.
  # Anche così qualche artefatto passa — è un limite del modello, non del
  # prompt: nel dubbio preferire soggetti senza cartelli (interni, primi piani).
  ai_style: >
    Absolutely no text, no letters, no signage, no shop signs, no posters, no
    numbers, no watermarks anywhere in the frame.
    Editorial documentary photograph, natural available light, muted desaturated
    palette, shallow depth of field, 50mm lens, subtle film grain, quiet and
    restrained composition with generous negative space.
    No people looking at the camera.

  # Tetto di immagini GENERATE per post — vale solo per quelle a pagamento.
  # Le immagini cercate (Wikimedia, Pexels) sono gratuite e non sono contate,
  # quindi con ai_provider: "none" questo valore non limita nulla.
  # 5 slide × 2 post/giorno = 300 immagini/mese: a $0.02 sono ~6 $/mese.
  # Esaurito il tetto, le slide concettuali ripiegano sulla ricerca.
  # Con un provider gratuito non c'è motivo di limitarla: ogni slide che non
  # ottiene un'immagine è un buco nel carosello. Alzalo solo se passi a un
  # provider a pagamento.
  max_ai_images_per_post: 5

  # ⚠️ Le immagini reperite sono filtrate per licenza (solo pubblico dominio,
  # CC0, CC BY, CC BY-SA) e il credito viene stampato sulla slide.
  # Quelle generate sono etichettate come illustrazione: sia Instagram che
  # TikTok richiedono di dichiarare i contenuti sintetici.

# ─── PIPELINE ─────────────────────────────────────────────────────────────────
pipeline:
  # Motore di generazione testo.
  #   anthropic  Claude. Nettamente migliore nel ruolo critico — il fact-check
  #              ostile che smonta le curiosità false prima che le pubblichi.
  #              Richiede credito a consumo (~0,10-0,25 $ a post).
  #   gemini     Google. Free tier vero sui modelli di TESTO. Qualità
  #              inferiore, ma fa girare tutto a costo zero.
  provider: "gemini"

  # Deve corrispondere al provider:
  #   anthropic → claude-opus-5 (o claude-sonnet-5, più economico)
  #   gemini    → gemini-3.5-flash | gemini-2.5-flash | gemini-3.1-flash-lite
  # Nota: ogni modello ha la sua quota giornaliera indipendente. Se esaurisci
  # quella di uno, cambiare modello qui riparte subito senza aspettare.
  model: "gemini-3.1-flash-lite"

  # Il modello usato SOLO quando una chiamata accende la ricerca web. Oggi
  # e' un punto solo: `capitolo.scrivi`, che deve scegliere studi veri prima
  # di scriverci sopra dodici minuti.
  #
  # Perche' serve un campo a parte, misurato il 3 settembre 2026 mandando la
  # STESSA richiesta con `google_search` acceso e con la chiave di Mattia:
  #
  #     gemini-3.1-flash-lite   429      <- il modello qui sopra
  #     gemini-3.5-flash        429
  #     gemini-2.5-flash        200
  #
  # Gli stessi due modelli rispondono 200 alla stessa richiesta senza
  # ricerca, e reggono decine di chiamate al giorno. Quindi la quota di
  # grounding e' separata da quella di testo, ed e' per coppia (modello,
  # funzionalita'): aspettare domani o cambiare `model` non risolve, e il
  # commento di agosto qui sotto — "il grounding richiede fatturazione,
  # free tier zero" — era vero per i modelli provati allora, non per tutti.
  #
  # Il primo capitolo e' fallito quattro volte per questo, con il messaggio
  # "Quota Gemini esaurita" che mandava a cercare nel posto sbagliato.
  model_ricerca: "gemini-2.5-flash"

  # Come si verificano i fatti.
  #   native     il modello cerca da solo. Su Anthropic è incluso; su Google
  #              il grounding richiede fatturazione attiva (free tier zero).
  #   wikipedia  si portano al modello gli estratti di Wikipedia. Gratis,
  #              nessuna chiave. Non è una fonte primaria e non copre tutto,
  #              ma intercetta le attribuzioni sbagliate e i numeri derivati,
  #              che sono il grosso delle curiosità false in circolazione.
  #   none       nessuna fonte esterna: sconsigliato, il fact-check diventa
  #              una seconda opinione dello stesso modello.
  web_search: "wikipedia"

  # Solo Gemini: tetto ai token di ragionamento. Su Gemini il ragionamento
  # consuma lo stesso budget della risposta, quindi senza limite il JSON viene
  # troncato a metà. Alzarlo migliora il giudizio ma aumenta il rischio.
  thinking_budget: 2048
  # Quante idee generare per batch. Se ne scarti molte in verifica, alza.
  ideas_per_batch: 16

  # Scorte minime per canale, sotto le quali il ciclo genera. Il fabbisogno
  # giornaliero è di 5 curiosità su Instagram (2 caroselli + 3 reel) e 9 su
  # YouTube (3 video da 3): questi valori tengono circa un giorno di margine.
  # I due registri sono separati, quindi la stessa curiosità può servire
  # entrambi i canali — ma mai due volte lo stesso.
  # Aggiornati il 20 agosto 2026 sul consumo VERO, che non era più quello del
  # commento qui sopra. Il buffer non è una preferenza: è il consumo di un
  # giorno più un margine, e va rifatto ogni volta che cambia il ritmo di un
  # canale — altrimenti il magazzino si svuota senza che nulla lo segnali.
  #
  #   Instagram   1 carosello + 1 reel      =  2/giorno
  #   YouTube     1 Short × 3 curiosità     =  3/giorno
  #   TikTok      4 video × 4 curiosità     = 16/giorno   ← il più affamato
  #
  # TikTok mancava del tutto dal fabbisogno in `_rifornisci`: consumava sedici
  # curiosità al giorno senza far scattare una sola generazione.
  buffer_instagram: 6
  buffer_youtube: 9
  buffer_tiktok: 20

  # Tetto di generazioni per singolo giro. La generazione è l'unico punto che
  # può consumare quota senza un limite naturale: se il fact-check bocciasse
  # tutto, senza tetto girerebbe finché non finisce la quota giornaliera.
  max_batches_per_run: 2
  # Soglia minima di confidenza per pubblicare. 0.85 è severo di proposito:
  # una pagina di curiosità che posta bufale viene distrutta nei commenti.
  # Abbassato da 0.85 a 0.75 il 10 agosto, insieme alla revisione del
  # fact-check. Prima il verificatore rispondeva 0.95-0.99 a tutto e la soglia
  # non filtrava nulla; ora la scala è calibrata sul serio e un fatto ben
  # documentato si assesta fra 0.80 e 0.94. Con 0.85 verrebbero scartate anche
  # curiosità vere e ben sostenute.
  min_confidence: 0.75
  # Similarità massima con un post già pubblicato (0-1). Sopra → scartato.
  max_similarity: 0.55
  # Post al giorno. IG tollera fino a 25-50 via API ma 1-2 è il ritmo giusto
  # per una pagina nuova: l'algoritmo premia la costanza, non il volume.
  posts_per_day: 2
  # Ore locali di pubblicazione (24h).
  post_hours: [13, 20]
  timezone: "Europe/Amsterdam"

# ─── APPROVAZIONE UMANA ───────────────────────────────────────────────────────
# Con `require_approval: true` la pipeline si ferma prima di pubblicare e ti
# manda il post su Telegram con i bottoni Approva/Scarta.
# Consigliato ON per le prime 2-4 settimane: è il modo più economico di
# scoprire cosa sbaglia il generatore prima che lo veda il pubblico.
  # Tre modalità:
  #   auto     pubblica subito, nessun avviso. Massima automazione, zero
  #            controllo.
  #   veto     ti manda il post su Telegram e aspetta `veto_minutes`. Se non
  #            dici niente esce; se rispondi /no viene bloccato. Automatico di
  #            default, fermabile — nessuna approvazione richiesta.
  #   approval non pubblica finché non approvi. Se Telegram non è configurato
  #            i post restano bloccati per sempre: usare solo con Telegram.
  mode: "auto"

  # Solo per mode: veto. Quanto aspettare prima di pubblicare.
  # Attenzione al costo su GitHub Actions: il job resta acceso ad aspettare.
  # 10 minuti × 2 post/giorno × 30 = 600 minuti/mese sui 2000 gratuiti.
  veto_minutes: 10

  # Compatibilità: se `mode` non è impostato si ricade su questo.
  require_approval: false
  channel: "telegram"             # telegram | none

# ─── PUBBLICAZIONE ────────────────────────────────────────────────────────────
publish:
  instagram:
    # ⏸️  CAROSELLI IN PAUSA dal 19 agosto 2026. NON è una scelta editoriale:
    # Meta blocca la pubblicazione delle immagini su questo account.
    #
    # Cosa è stato misurato prima di spegnere. I contenitori si creano tutti e
    # cinque e arrivano a FINISHED; è la sola `media_publish` a rispondere 403
    # «azione bloccata». Dal 16 agosto alle 13:04 i video passano sempre e le
    # immagini non passano mai — stesso token, stessa app, stessa chiamata.
    # Escluso: la quota (1 su 100, app all'1%), il token (i reel ci passano),
    # le immagini (200 e contenitori FINISHED), l'hosting (i post 24 e 25 sono
    # usciti dallo stesso raw.githubusercontent.com) e il nostro codice (il 16
    # agosto non è stata toccata una riga).
    #
    # Perché spegnere invece di lasciar ritentare: il ciclo riprovava quattro
    # volte al giorno, e i blocchi di integrità di Meta si allungano quando
    # l'azione bloccata viene ripetuta. Si stava peggiorando la situazione.
    #
    # Si riaccende dopo il ricorso: Instagram → Impostazioni → Stato
    # dell'account. I reel NON sono toccati da questo interruttore e
    # continuano a uscire.
    enabled: false

    # Quanti caroselli al giorno. Come per `reel.al_giorno`, NON è questo campo
    # a farli uscire — a farli uscire sono le fasce in cycle.yml, una per
    # carosello. Serve alla guardia in engine/allarme.py per sapere cosa
    # aspettarsi: se i due numeri non combaciano, o grida al lupo ogni giorno
    # o resta muta mentre il canale si ferma.
    #
    # Sceso da 2 a 1 il 20 agosto 2026, insieme alla fascia tolta in cycle.yml.
    al_giorno: 1
  youtube:
    # Verificato con un caricamento reale l'11 agosto 2026.
    # Quota: 6 caricamenti al giorno — ai 3 reel attuali sta larga.
    enabled: true
    # true = YouTube riceve la variante da ~33 secondi con tre curiosita',
    # dentro la finestra 30-45s che la piattaforma premia. Instagram continua
    # a ricevere il formato breve, che e' quello che funziona li'.
    # false = stesso video su entrambe (piu' semplice, meno efficace su YT).
    long_form: true
    # Quante curiosita' in fila nel video lungo. A ~11 secondi l'una, 3 danno
    # ~33 secondi. Sotto i 30 il video esce dalla finestra che YouTube premia,
    # sopra i 45 la percentuale di visione crolla.
    facts_per_video: 3

    # L'episodio lungo settimanale (lungo.yml, ~5 minuti con narrazione).
    # ACCESO — il cron del sabato in lungo.yml gira.
    #
    # Questo campo NON fa uscire l'episodio: a farlo uscire e' quel cron.
    # Serve a engine/allarme.py, che ha "YouTube episodio" fra i canali
    # sorvegliati con una soglia di 22 giorni. Finche' i due valori dicono la
    # stessa cosa non succede niente; il giorno che si commenta il cron senza
    # toccare questo campo, la guardia comincia a segnalare ogni giorno un
    # canale spento di proposito.
    #
    # E' il guasto del 19 agosto in miniatura: una guardia che grida al lupo
    # non smette di funzionare, smette di essere letta — e la volta che il
    # guasto c'e' davvero non se ne accorge nessuno. Vanno cambiati insieme,
    # come max_per_day e orari.
    episodio_lungo_attivo: true
    # Tetto di video al giorno. Non è la quota API (sei caricamenti al giorno,
    # ne servono tre): oltre i due-tre Short quotidiani la spinta per video
    # cala, perché ognuno viene provato su un piccolo pubblico prima di essere
    # distribuito e pubblicarne troppi significa togliersi spazio da soli.
    # Sceso da 3 a 1 il 19 agosto 2026, per prova e a tempo. Il ragionamento
    # è di Mattia e regge: con tre Short al giorno su un canale che non ha
    # ancora pubblico, ogni video viene provato su un piccolo campione e i
    # tre si tolgono spazio a vicenda. Uno solo concentra la spinta, e con
    # un video al giorno la differenza fra un aggancio buono e uno mediocre
    # si legge — con tre in fila si legge solo la media.
    #
    # Da rivalutare fra un paio di settimane guardando `run.py esperimento`
    # e le iscrizioni in Studio, non le visualizzazioni del singolo video.
    #
    # Risalito da 1 a 2 il 21 agosto 2026, e SOLO per la durata della prova
    # sulla lunghezza (vedi `esperimento.lunghezza`). Non e' un ripensamento
    # sul ragionamento di sopra, che resta valido: serve perche' i due gruppi
    # devono uscire negli STESSI giorni, altrimenti il giorno della settimana
    # diventa la vera variabile e il confronto non vale niente.
    #
    # Cosa si perde: da oggi il canale non e' piu' confrontabile con il
    # proprio passato, perche' cambiano insieme lunghezza e cadenza. Cosa NON
    # si perde: il confronto fra i due gruppi, che vivono entrambi dentro la
    # stessa cadenza e la subiscono uguale.
    #
    # Ritornato a 1 il 21 agosto 2026, prima che la prova cominciasse. La
    # seconda fascia era durata un giorno: serviva a far uscire i due gruppi
    # negli stessi giorni, ma quel vantaggio non paga il costo sul canale, che
    # e' il ragionamento di Mattia qui sopra e non e' mai stato smentito. La
    # prova si adatta allungandosi a 60 giorni — stessi 30 video per gruppo,
    # un mese in piu' di calendario. Vedi `esperimento.lunghezza.giorni`.
    #
    # ATTENZIONE, e' il punto in cui e' facile sbagliare: questo campo NON
    # decide quanti Short escono. E' un tetto. A far uscire i video e' il
    # numero di voci in `orari` qui sotto. Cambiarne uno solo lascia il
    # sistema incoerente — due fasce con tetto 1, o una fascia con tetto 2 —
    # e nel primo caso il secondo video viene costruito e poi buttato via.
    # Vanno sempre cambiati insieme.
    #
    # RISALITO A 2 il 3 settembre 2026, e questa volta con i dati in mano.
    #
    # Il taglio del 19 agosto poggiava su un'ipotesi esplicita: con tre Short
    # al giorno su un canale senza pubblico i video si tolgono spazio a
    # vicenda, quindi uno solo dovrebbe rendere di piu'. L'ipotesi prevedeva
    # che le viste PER VIDEO salissero. Misurate a parita' di eta' (viste al
    # terzo giorno dalla pubblicazione, che e' l'unico confronto onesto fra un
    # video di ieri e uno di tre settimane fa):
    #
    #     14-18 agosto   3 video/giorno   media 345 viste   ~1.035 al giorno
    #     25-31 agosto   1 video/giorno   media 257 viste   ~257  al giorno
    #
    # Le viste per video sono SCESE del 25%, non salite. E gli iscritti ogni
    # mille viste sono rimasti fermi: 0,81 prima, 0,85 dopo. La prova ha
    # falsificato la propria ipotesi. Il taglio e' costato due terzi della
    # copertura e non ha comprato niente di misurabile.
    #
    # Due e non tre per scelta di Mattia: e' la via di mezzo fra la cadenza
    # che i dati premiano e il non tornare di colpo al massimo, e resta il
    # punto in cui il ritmo era stato analizzato in dettaglio ad agosto —
    # 2 al giorno x 2 curiosita' dava 60 video al mese con 1,29 riusi medi e
    # zero video quasi identici.
    #
    # Effetto sulle due prove in corso (lunghezza e apertura): nessuno sul
    # confronto fra i gruppi, che e' il punto. La cadenza cambia per tutti e
    # due i bracci insieme, quindi si elide — ed e' esattamente quello che
    # dice gia' il commento del 21 agosto qui sopra. Cambia in meglio la
    # potenza: i ~31 video per gruppo arrivano in ~30 giorni invece di 60.
    # A due fasce le formule di `scegli_lunghezza` e `scegli_apertura` sono
    # nel loro caso nativo: ogni giornata contiene un video per gruppo e i
    # gruppi si scambiano la fascia, quindi l'ora non entra nel confronto.
    max_per_day: 2

    # Orari di uscita, in ORA ITALIANA. Non sono gli orari in cui gira il
    # workflow: il primo giro della giornata carica tutti e tre i video e li
    # programma per queste ore, poi ci pensa YouTube. Due conseguenze volute.
    #
    # 1. L'ora è esatta. I cron di GitHub partono in ritardo — misurato fino a
    #    64 minuti — quindi finora l'orario di uscita era quello che capitava.
    # 2. La giornata si vede tutta la mattina. Se manca un video lo si nota
    #    subito in YouTube Studio, invece di scoprirlo a sera.
    #
    # Sono in ora italiana e non in UTC perché così restano davvero fissi:
    # scritti in UTC sembrerebbero fissi ma slitterebbero di un'ora l'ultima
    # domenica di ottobre, quando finisce l'ora legale. La conversione la fa
    # il programma ogni giorno.
    #
    # Perché ne resta una sola e perché proprio questa. Il canale è in inglese
    # e su Shorts l'inglese pesca soprattutto da Stati Uniti e Regno Unito:
    # le 19:00 italiane sono il primo pomeriggio sulla costa est e la sera in
    # Europa, cioè l'unica fascia che prende bene entrambi. È anche l'unica
    # con un riscontro nostro: sui primi cinque video, le due uscite di
    # mezzogiorno hanno fatto 115 e 117 visualizzazioni e quella delle 19:45
    # ne ha fatte 497. Cinque video non distinguono l'orario dal contenuto —
    # quel video aveva anche l'aggancio migliore — ma punta nella stessa
    # direzione del ragionamento sui fusi, che regge da solo.
    #
    # La seconda fascia e' tornata il 21 agosto 2026 per la prova sulla
    # lunghezza, ed e' durata un giorno: le 13:00 italiane sono la mattina
    # presto sulla costa est e l'ora di pranzo in Europa, cioe' la seconda
    # fascia meno peggio, ma resta peggiore delle 19:00. Toglierla costa alla
    # prova un mese di calendario e non le costa un solo video, perche' i 30
    # video per gruppo si raggiungono lo stesso in 60 giorni.
    #
    # In cambio si guadagna una cosa che lo scambio di fasce poteva solo
    # approssimare: con un orario solo, l'ora di uscita smette proprio di
    # essere una variabile. Tutti i video di tutti e due i gruppi escono alle
    # 19:00, quindi non c'e' niente da bilanciare e niente che possa
    # sbilanciarsi se una giornata salta.
    #
    # TORNATE DUE il 3 settembre 2026, insieme a `max_per_day` (i due campi
    # vanno sempre cambiati insieme — vedi l'avvertenza qui sopra).
    #
    # DODICI ORE ESATTE, per scelta di Mattia. Le 11:00 e le 23:00 e non
    # un'altra coppia: il vincolo non e' editoriale, e' meccanico, e lascia
    # pochissimo spazio.
    #
    # Gli Short non escono quando gira il workflow: il giro del mattino li
    # carica e li PROGRAMMA. Una fascia e' programmabile solo se manca piu' di
    # dieci minuti (il margine in `_fasce_da_coprire`), e quel giro parte alle
    # 9:45 italiane con ritardi di coda GitHub misurati fino a 64 minuti —
    # quindi nel caso peggiore comincia verso le 10:50. La prima fascia non
    # puo' stare prima delle 11:00 senza rischiare di essere scartata proprio
    # nei giorni in cui GitHub e' lento. E la seconda, a dodici ore esatte,
    # non puo' superare le 23:59, perche' `_fasce_di_oggi()` costruisce le
    # fasce di OGGI e la mezzanotte sarebbe gia' domani.
    # Fra le 11:00 e le 11:59 di partenza possibili, le 11:00 tonde.
    #
    # ⚠️ IL COSTO, scritto perche' non venga scoperto fra un mese guardando i
    # numeri. Le 23:00 sono ottime: le 17:00 a New York e le 22:00 a Londra.
    # Le 11:00 sono la fascia peggiore della giornata — le 5:00 del mattino a
    # New York — ed e' esattamente il difetto per cui le vecchie 7:15 e 11:15
    # erano state tolte il 13 agosto. Dodici ore esatte lo impongono: la
    # finestra buona per un canale in inglese (18:00-01:00 italiane) e' larga
    # sette ore, quindi due uscite equidistanti non ci stanno dentro tutte e
    # due. Si sta scambiando una fascia forte con la copertura di mezza
    # giornata in piu'.
    #
    # Se fra due settimane le 11:00 rendono molto meno delle 23:00, la
    # spiegazione piu' probabile e' questa e non il contenuto: la coppia da
    # provare allora e' 19:00 + 23:00, che rinuncia all'equidistanza e tiene
    # tutte e due le uscite dentro la finestra buona.
    orari: ["11:00", "23:00"]
    fuso: "Europe/Rome"

    # Quanto deve restare ferma una curiosità prima di poter tornare come
    # spalla in un altro video. Senza, quella appena uscita ricompare nel
    # video successivo al proprio: chi guarda due Short di fila vede due
    # volte la stessa cosa, ed è il modo più veloce per sembrare una pagina
    # che ricicla. Si allarga da sé se l'archivio è ancora troppo corto.
    reuse_cooldown_hours: 48

  tiktok:
    # I video NON si pubblicano da soli, e non è una limitazione tecnica che
    # si può aggirare: l'API può solo depositare bozze nell'inbox dell'app,
    # mentre il programmatore di TikTok sta in TikTok Studio (desktop). Sono
    # due percorsi che non si incontrano — una bozza nell'inbox non la puoi
    # passare a Studio. Quindi si salta l'API del tutto: `run.py tiktok`
    # prepara i file, tu li trascini in Studio e li programmi in un colpo.
    # Vantaggio collaterale: niente app sviluppatore, niente audit di 2-4
    # settimane, niente verifica del dominio.
    #
    # Spento l'11 agosto 2026 perché l'automazione completa costa (~16-29 $
    # al mese) e i fornitori stessi dicono che pubblicare via API rende meno
    # in copertura che pubblicare dall'app. Restavano quattro tocchi al giorno
    # sul telefono, che non valevano il fastidio.
    #
    # RIACCESO il 19 agosto 2026. Due cose sono cambiate. La prima: i tocchi
    # sono due invece di quattro, perché la didascalia ora arriva su Telegram
    # in un blocco che si copia toccandolo, e non va più né scritta né cercata
    # su un foglio. La seconda, che pesa di più: i tredici video del lotto di
    # agosto sono già montati e le sessantadue curiosità che contengono sono
    # già segnate come consumate su TikTok. Quel costo è già stato pagato, e
    # tenerli fermi è l'unica scelta con ritorno certo pari a zero.
    #
    # Resta però `false`, e non è una contraddizione: questo interruttore NON
    # governa i video. Governa un solo punto del codice, l'invio delle cinque
    # immagini di un carosello a TikTok come photo post — una strada che
    # richiede PULL_FROM_URL e quindi la verifica del dominio, impossibile su
    # raw.githubusercontent.com che non è nostro. A true fa solo fallire una
    # chiamata a ogni carosello.
    # I video seguono un'altra strada, `run.py tiktok` e `run.py ttcarica`,
    # che non guarda questo campo: per quelli bastano i tre secret TIKTOK_*.
    enabled: false

    # Quanti video prepara ogni volta. Studio programma fino a 10 giorni
    # avanti (non 30: quelli sono gli scheduler esterni), quindi un lotto da
    # 20 copre dieci giorni a due al giorno.
    batch: 20

    # Quattro curiosità per video. Su TikTok i contenuti che spiegano qualcosa
    # rendono meglio fra i 42 e i 54 secondi — più larga della finestra di
    # YouTube (30-45) e molto più di quella di Instagram (7-15). Quattro per
    # ~11 secondi l'una centrano i 45.
    facts_per_video: 4
    target_seconds: 45.0

    # Non serve generare curiosità apposta: il registro dei consumi è per
    # canale, e su TikTok non è mai uscito nulla. Tutto l'archivio è materiale
    # nuovo per quel pubblico — è cross-posting, non riciclo.
    max_per_day: 2

    # Tetto di TikTok, non nostro: cinque bozze pendenti ogni 24 ore, scritto
    # nella loro documentazione. Il ciclo si ferma da sé quando lo tocca,
    # senza trattarlo come un errore — è il ritmo previsto, non un guasto.
    max_bozze_al_giorno: 5

    # ─── BOZZA O PUBBLICAZIONE VERA ─────────────────────────────────────────
    #   inbox   il video arriva fra le bozze dell'app e lo pubblichi tu.
    #           Non serve nessun permesso speciale. È dove siamo oggi.
    #   direct  il video va online da solo, come su YouTube.
    #
    # È già su `direct`, e NON è un errore anche se l'audit non c'è ancora.
    # Il codice prova la pubblicazione diretta, riceve `unaudited_client` o
    # `scope_not_authorized`, e ripiega da solo sulla bozza — quindi oggi si
    # comporta esattamente come prima. Il giorno che TikTok approva l'app, il
    # primo giro utile pubblica da solo senza che nessuno tocchi niente.
    #
    # È l'unico modo onesto di scriverlo: l'audit passa in un giorno che non
    # sappiamo in anticipo, e l'alternativa sarebbe indovinare la data. Chi
    # indovina tardi perde giorni di pubblicazione automatica; chi indovina
    # presto pubblica video in visibilità privata — che è il guasto peggiore
    # perché sembra funzionare e non lo vede nessuno.
    mode: "direct"

    # Chi vede il video. Non viene scritto e basta: prima di ogni pubblicazione
    # si chiede a TikTok (`creator_info`) quali visibilità l'account permette,
    # e se questa non è fra quelle il giro si ferma con un messaggio chiaro.
    # Di solito significa una cosa sola: il profilo TikTok è privato.
    privacy: "PUBLIC_TO_EVERYONE"

# ─── COMMENTI ─────────────────────────────────────────────────────────────────
# Rispondere entro la prima ora è il segnale più forte dopo i salvataggi, e
# ogni risposta riporta la persona sul post.
comments:
  # true = le risposte passano da Telegram prima di uscire.
  # false = escono da sole, TRANNE quelle che il modello marca come da leggere
  #         a un umano: correzioni, cose mediche, confidenze personali. Quelle
  #         restano senza risposta, che è l'esito giusto — se qualcuno segnala
  #         un errore vero, una risposta automatica che difende il post fa più
  #         danno di dieci risposte mancate.
  #
  # Sta su false perché non c'è nessuno in ascolto: Telegram non è configurato,
  # e con true le risposte si accumulavano in coda senza che nessuno potesse
  # approvarle. Meglio rispondere alle domande facili e tacere sul resto.
  require_approval: false
  # Quanto indietro guardare. Sui post più vecchi i commenti arrivano col
  # contagocce e interrogarli brucia il rate limit per niente.
  window_hours: 48

  # Tetto di risposte per giro. Un account che risponde a TUTTI, sempre, è
  # riconoscibile come automatico quanto uno che risponde male: le persone
  # vere rispondono a una parte dei commenti, non a tutti. Le correzioni non
  # rientrano nel tetto — quelle vanno sempre gestite.
  max_replies_per_run: 6

  # Tetto sulle ANALISI, che è cosa diversa dal tetto sulle risposte: ogni
  # commento nuovo costa una chiamata al modello *prima* che si decida se
  # rispondere. Con un video che gira, trecento commenti sarebbero trecento
  # chiamate in un giro solo — sulla stessa quota che serve a generare le
  # curiosità. Quelli oltre il tetto restano nuovi e toccano al giro dopo.
  max_drafts_per_run: 20

caption:
  max_chars: 900
  hashtag_count: 12
  # Hashtag fissi sempre presenti (brand). Il resto li genera Claude sul tema.
  pinned_hashtags: ["psychologyfacts", "humanbehaviour"]
  cta: "Follow @oddlywireddaily for one a day."

  # Rimando al canale YouTube, accodato alla didascalia prima degli hashtag.
  # Instagram non rende cliccabili i link in didascalia: va scritto in modo
  # che si possa cercare a mano, quindi il nome del canale e non un URL lungo.
  # Il link vero e proprio va messo in bio — quello sì cliccabile — e la bio
  # non è modificabile da API, quindi resta l'unica cosa da fare a mano.
  # Svuotare la stringa per toglierlo.
  cross_promo: "More on YouTube: @OddlyWiredDaily"

  # Dichiarazione dei contenuti sintetici. Obbligatoria in UE dal 2 agosto 2026
  # (AI Act, art. 50): deve essere percepibile senza strumenti tecnici e al
  # primo contatto. Sulle slide il credito è già stampato; questa riga copre
  # chi legge solo la caption. Svuotare la stringa la disattiva — sconsigliato.
  # La seconda frase non è difensiva: distingue l'illustrazione, che è
  # generata, dal fatto, che è verificato. È il contrario di quello che fanno
  # le pagine che nascondono l'uso dell'AI.
  # Disattivata di scelta: la dichiarazione è già data due volte — il credito
  # "Illustration: AI-generated" stampato su ogni slide, e l'etichetta
  # "AI creator" attivata sul profilo Instagram. Ripeterla in caption sarebbe
  # ridondante. Riattivare mettendo una stringa qui se le regole cambiano.
  ai_disclosure: ""

# ─── LA RICHIESTA FINALE ──────────────────────────────────────────────────────
# Fino al 20 agosto 2026 i video finivano e basta: l'ultima curiosità sfumava e
# il file era finito. Nessuna richiesta, mai, in nessuno dei tre formati. Il
# ponte verso gli altri canali stava solo nel commento fissato di TikTok, che
# lo legge una frazione di chi guarda.
#
# Perché una domanda e non "iscriviti": si commenta per avere ragione, non per
# dare un'opinione. "Which one was new to you?" ha una risposta breve — un
# numero — e chi ha appena visto quattro curiosità ce l'ha già in testa. Un
# "dimmi cosa ne pensi" chiede di comporre una frase, che è dieci volte il
# lavoro e infatti non lo fa nessuno.
#
# La chiocciola NON va scritta qui: il filigrana `brand.watermark` è già
# stampato in fondo a ogni fotogramma, compreso questo. Ripeterla toglierebbe
# spazio alla richiesta senza aggiungere niente.
cta:
  # Il fotogramma si aggiunge DOPO l'ultima curiosità, non le ruba tempo.
  # 2,4 secondi: il minimo per leggere due righe corte. Il totale passa da 45
  # a 47 su TikTok e da 33 a 35 su YouTube — dentro le finestre premiate in
  # tutti e due i casi (42-54 e 30-45).
  #
  # ⚠️ Allungare il video ABBASSA la percentuale di visione anche se non
  # guarda meno nessuno: gli stessi 22 secondi visti su 47 fanno 48% dove su
  # 45 facevano 50%. Da qui in poi il numero da guardare è
  # `averageViewDuration` in SECONDI, non la percentuale. Chi confronta le
  # percentuali prima e dopo questa riga conclude il contrario di quello che
  # è successo.
  secondi: 2.4

  # Fissa, non generata dal modello. Se cambiasse a ogni video non sapremmo se
  # a muovere i numeri è la richiesta o quale versione è capitata. Si passa a
  # una versione generata solo dopo che questa ha dato una misura.
  domanda: "Which one was new to you?"

  # Il verbo cambia per piattaforma — su YouTube si dice "subscribe", altrove
  # "follow" — e usare la parola sbagliata segnala che il video è riciclato.
  # Sul fotogramma lo spazio è due righe lette in due secondi, quindi qui la
  # promessa sta in quattro parole invece che in una frase: è la stessa dei
  # testi qui sotto, compressa. "We name every study" dice in mezzo secondo
  # ciò che nessun'altra pagina di curiosità può dire.
  # CAMBIATE il 3 settembre 2026. Cosa si è misurato prima di toccarle: in 23
  # giorni e 42 video, 13.091 visualizzazioni hanno prodotto 11 iscritti e 6
  # commenti. Sono 0,84 iscritti ogni mille viste, contro una media di 2,27
  # per gli Short e un 5 considerato buono. La promessa di credibilità ha
  # avuto tre settimane per funzionare e ha convertito un terzo della media.
  #
  # PERCHÉ CAMBIA IL TIPO DI PROMESSA, non solo le parole. "We name every
  # study" dice perché fidarsi di questo video. Non dice cosa ricevi domani, e
  # l'iscrizione è una scommessa su domani: si preme perché si vuole ancora
  # QUELLA cosa, non perché il video appena visto era fatto bene. Le due righe
  # nuove promettono la ricorrenza ("one a day") e il registro che ha vinto la
  # prova di agosto — il riconoscimento, "una cosa su di te" — invece della
  # verificabilità.
  #
  # La verificabilità NON si perde: resta per intero in `testo` qui sotto, che
  # va nella descrizione, dove lo spazio c'è. Sul fotogramma no, perché sono
  # due righe lette in 2,4 secondi e non ci stanno tutte e due le promesse.
  # La lunghezza è la stessa di prima (32 caratteri contro 30), quindi il
  # confronto non è inquinato dal tempo di lettura.
  #
  # Come si legge l'esito: iscritti ogni mille viste sui video usciti DOPO il
  # 3 settembre, contro gli 0,84 di prima. Non i like, che nei due gruppi di
  # agosto erano identici (0,7%) mentre la visione cambiava — i like qui non
  # misurano niente. Serve un mese: a 2 Short al giorno sono ~60 video.
  #
  # ⚠️ Questa riga NON confonde le due prove in corso (lunghezza e apertura):
  # cambia per tutti i video di tutti e quattro i bracci nello stesso giorno,
  # quindi si elide nel confronto fra gruppi. Rompe invece il paragone col
  # passato del canale, ed è il prezzo accettato.
  azione:
    youtube: "Subscribe. One a day, about you."
    tiktok: "Follow. One a day, about you."
    default: "One a day, about you."

  # Le stesse richieste in forma di testo, per descrizioni e didascalie.
  #
  # Senza la voce `youtube` la descrizione di uno Short prendeva `caption.cta`,
  # che porta la chiocciola Instagram, e sommata al rimando esplicito in
  # youtube.py chiedeva DUE VOLTE di andare altrove senza chiedere mai
  # un'iscrizione: il canale che vogliamo far crescere mandava via il pubblico.
  # Un canale senza voce qui ricade su `caption.cta`.
  #
  # PERCHÉ SONO SCRITTE COSÌ. "Follow for more psychology facts" è quello che
  # dicono diecimila pagine identiche, e non dà nessun motivo per scegliere
  # questa. Queste righe promettono l'unica cosa che qui c'è e altrove quasi
  # mai: il nome dello studio, gli autori, l'anno. E la seconda frase promette
  # ciò che nessuno promette — di dire quando un risultato è contestato. È una
  # promessa verificabile in un clic, il che la rende forte: chi la controlla
  # trova che è vera.
  #
  # ⚠️ Non sono un vanto generico e non vanno annacquate. Il giorno in cui una
  # curiosità esce senza fonte, questa riga diventa una bugia stampata sotto a
  # ogni video. È anche il motivo per cui `bluesky.componi` si rifiuta di
  # pubblicare un fatto senza `source_hint`.
  # Nella descrizione lo spazio non è il vincolo, quindi qui stanno TUTTE e
  # tre le promesse invece delle due che entrano sul fotogramma: cosa ricevi
  # domani (ricorrenza), di cosa parla (tu), e perché fidarsi (lo studio
  # nominato). L'ordine è quello: la ragione per iscriversi sta davanti, la
  # ragione per credere dietro — chi legge la descrizione di uno Short si
  # ferma dopo poche parole, e finora la prima cosa che leggeva era una
  # promessa di metodo.
  testo:
    youtube: "Subscribe — one a day, and every one is about something you already do without noticing. Every one names the study it came from, and says so when a finding is contested."
    tiktok: "Follow — one a day, and every one is about something you already do without noticing. Every one names the study it came from."
    instagram: "Follow @oddlywireddaily — one a day, and every one is about something you already do without noticing. Every one names the study it came from, and says so when a finding is contested."

  # Bluesky non ha spazio: i post stanno a 290-296 caratteri su 300, e lo
  # spazio che manca lo paga già la spiegazione, che esce troncata. Una riga
  # di richiesta dentro il post ruberebbe caratteri alla fonte o al fatto.
  # Va invece in RISPOSTA al proprio post, dove non costa niente — ed è anche
  # l'unico posto dove Bluesky sa che gli altri canali esistono: nel post non
  # c'è mai stato un rimando a YouTube, TikTok o Instagram.
  bluesky_coda: "One checked fact a day. Every one names the study, the authors and the year — and says so when a finding is contested."

# ─── REEL ─────────────────────────────────────────────────────────────────────
# Flusso separato dai caroselli: cadenza diversa, tempi diversi, guasti
# diversi. Se i video si rompono, i post continuano a uscire.
reel:
  # 9 secondi: la finestra 7-15s ha i tassi di completamento e di replica piu'
  # alti. Sotto i 7 il video finisce prima che l'algoritmo registri una
  # visione piena; sopra i 15 le repliche crollano.
  line_seconds: 9.0
  batch: 2                # quante frasi generare per volta

  # Quanti reel Instagram al giorno. NON è questo campo a farli uscire — a
  # farli uscire sono le fasce in .github/workflows/reels.yml, una per reel.
  # Serve alla guardia in engine/allarme.py per sapere cosa aspettarsi: se i
  # due numeri non combaciano, o la guardia grida al lupo ogni giorno o resta
  # muta mentre il canale si ferma. Cambiando le fasce, cambiare anche qui.
  al_giorno: 1
  # Coda volutamente minima: un magazzino grande invecchia. Ogni miglioria al
  # generatore rende peggiori i reel gia' in attesa, che usciranno comunque.
  min_queue: 1
  reveal_at: 3.4          # secondo in cui l'aggancio lascia il posto alla risposta
  # Quota di reel a frase singola (senza rivelazione). Alternare i due formati
  # evita che il profilo diventi prevedibile: chi vede sempre lo stesso schema
  # smette di aspettare la seconda parte.
  single_ratio: 0.4
  # Sotto questa soglia di curiosità non ancora usate nei reel, il ciclo ne
  # genera di nuove. Senza, i reel si esaurirebbero in circa una settimana
  # perché consumano fatti ma non ne producono.
  min_facts: 6
  # ─── Variante lunga per YouTube ────────────────────────────────────────────
  # Su Instagram resta il formato breve, che è quello che funziona lì; YouTube
  # riceve più curiosità in fila. Durata complessiva del video: la finestra
  # premiata è 30-45 secondi — sotto i 30 il video viene trattato come uno
  # scarto, sopra i 45 la percentuale di visione crolla e con lei la spinta.
  # Correzione colore applicata a ogni filmato di sfondo. Le clip di stock
  # arrivano da fonti diverse e non hanno nulla in comune: senza, una notturna
  # desaturata e una al neon rosa finiscono nello stesso video e la seconda non
  # sembra della stessa pagina. Su un profilo il colore è metà del riconoscimento.
  grade_saturation: 0.45
  # Comprime solo le luci alte, lasciando i neri dove sono. Abbassare la
  # luminosità di una quantità fissa spegnerebbe le clip già scure — misurato:
  # una notturna passava da 18 a 5 di luminosità media, cioè nero.
  grade_highlights: true

  # Velocità di lettura su schermo piccolo. Serve a decidere quando
  # l'aggancio lascia il posto alla rivelazione: prima era una frazione fissa
  # della durata, e su un aggancio corto lasciava secondi di attesa a vuoto —
  # il momento esatto in cui si scorre via.
  parole_al_secondo: 3.5
  # Pausa dopo che si è finito di leggere, prima della rivelazione. Serve a
  # far registrare la frase: senza, la rivelazione arriva addosso all'ultima
  # parola e si perdono entrambe.
  respiro: 0.7

  long_target_seconds: 33.0
  # Tetto per singola curiosità: la durata di ciascuna si ricava dividendo il
  # totale, ma con poche curiosità in archivio la divisione darebbe segmenti
  # lunghissimi con una frase ferma sullo schermo.
  long_max_seconds_per_fact: 16.0

# ─── PROVA A/B SUL REGISTRO ───────────────────────────────────────────────────
# Metà dei video YouTube sono scritti come sempre ("osservazione"), metà con un
# registro di riconoscimento: non "ecco come funziona la mente" ma "ecco una
# cosa su di te che credevi un tuo difetto".
#
# Ipotesi: la pagina ha like buoni (3,2%) ma pochissime iscrizioni (0,19%).
# Mancherebbe un motivo per restare. L'indizio: il video più forte dei primi
# cinque — 497 viste contro 115, e l'unico commento — era l'unico scritto così.
#
# Il gruppo di controllo NON va toccato mentre la prova è in corso, o il
# confronto perde significato.
esperimento:
  # Sotto questa soglia per gruppo, la differenza è rumore e non va letta.
  video_minimi: 6

  # ─── PROVA SULLA LUNGHEZZA ─────────────────────────────────────────────────
  # Domanda: un video con UNA curiosità sola rende più di uno con tre?
  #
  # Perché solo su YouTube. TikTok non espone nessun dato di visione, e nemmeno
  # dopo l'audit Production: `video.list` restituisce viste, like e commenti,
  # non il tempo guardato. Instagram è fermo sui caroselli. YouTube è l'unico
  # posto dove la risposta esiste.
  #
  # ⚠️ LA TRAPPOLA, che è doppia e va capita prima di leggere i numeri.
  # · La PERCENTUALE premia il corto per costruzione. Non è teoria: due nostri
  #   Short hanno averageViewPercentage 105% e 111%. Sopra cento, perché gli
  #   Short vanno in loop e il giro in più viene contato. Più il video è corto,
  #   più gira, più il numero si gonfia.
  # · I SECONDI premiano il lungo per costruzione. Un video da 18 secondi non
  #   può essere guardato 20 secondi; la nostra mediana attuale è 15 su clip
  #   da 33.
  # Quindi nessuna delle due decide. Decide `viste per video`, che è l'unica
  # non truccata dalla durata — ed è anche la più rumorosa che abbiamo.
  #
  # QUANTO RUMORE (misurato sui 21 Short degli ultimi 90 giorni, tutti lunghi
  # 33,1s con deviazione 0,5 — sono la stessa cosa ripetuta):
  #   viste            mediana 277, da 80 a 1.276   → CV 0,82
  #   secondi guardati mediana  15, da 10 a    37   → CV 0,38
  # Con CV 0,82 sulle viste servono ~30 video per gruppo per vedere una
  # differenza del 60%, ~42 per vederne una del 50%, ~168 per una del 25%.
  # Sotto quelle soglie NON stiamo misurando: stiamo leggendo il caso.
  #
  # E IL FATTO SCOMODO: sugli stessi 21 video la correlazione fra secondi
  # guardati e viste è 0,23, e i video sopra i 18 secondi guardati hanno viste
  # mediane PIÙ BASSE (209) di quelli sotto (296). Con n=21 non è una
  # smentita, ma la premessa "più ritenzione → YouTube spinge di più" sui
  # nostri dati non ha appoggio. La prova si fa lo stesso perché la differenza
  # di durata è grossa (18s contro 47s) e perché un mese costa poco — non
  # perché ci aspettiamo che vinca.
  lunghezza:
    attiva: true

    # 60 giorni a 1 Short al giorno = ~31 video per gruppo. Il numero che
    # conta è quello — una trentina per gruppo — non la durata: è la
    # dimensione a cui la soglia del 60% qui sopra separa un effetto vero dal
    # rumore.
    #
    # 31 e non 30 perché il 22 e il 23 agosto la prova è girata a due Short al
    # giorno, prima del cambio di cadenza. Quei quattro video restano dentro:
    # sono usciti coi prompt giusti e coprono una casella ciascuna delle
    # quattro. Il conto verificato sull'intero calendario è 62 video, 31 per
    # gruppo su tutti e due i fattori, caselle 15/15/16/16.
    #
    # L'unico rischio di quei due giorni era l'orario, perché le 13:00 rendono
    # meno delle 19:00 e i primi quattro video hanno usato tutte e due le
    # fasce. Sul gruppo lunghezza si annulla da solo — corto e lungo hanno
    # preso esattamente una fascia delle 13:00 a testa, che è il lavoro per
    # cui `alterna_fascia` esiste. Sul gruppo apertura le 13:00 sono capitate
    # entrambe allo scontro, e lì non conta: l'apertura si giudica sulla
    # tenuta a 3 secondi, che dipende dal video e non da quanta gente lo vede.
    #
    # Era 30 giorni a 2 Short al giorno, che dà lo stesso totale. Passato a
    # 60 x 1 il 23 agosto 2026, per decisione di Mattia: due Short al giorno
    # su un canale senza pubblico si tolgono spazio a vicenda, perché ognuno
    # viene provato su un campione piccolo prima di essere distribuito. La
    # cadenza è una scelta sul canale, non sulla prova, e la prova si adatta.
    #
    # Perché allungare invece di dimezzare. Simulando la regola di decisione
    # con la variabilità vera dei nostri 22 Short, a 15 video per gruppo la
    # prova sulla lunghezza becca un effetto grosso il 70% delle volte contro
    # il 78%, e sbaglia ad adottare il 6% contro l'1%. Allungando non si perde
    # niente tranne tempo, e un mese in più di formato costante va nella
    # stessa direzione della ragione per cui la prova dura un mese e non due
    # settimane: la distribuzione ha bisogno di vedere una cosa ferma.
    #
    # Un mese e non due settimane per scelta di Mattia: cambiare formato ogni
    # quindici giorni disorienta la distribuzione, che ha bisogno di vedere
    # una cosa costante prima di capire a chi darla.
    giorni: 60
    # Il 22 e non il 21, che è il giorno in cui la prova è stata scritta: il
    # giro delle 10:27 del 21 aveva già caricato e programmato lo Short delle
    # 19:00 col codice vecchio, e la fascia delle 13:00 era passata. Il 21 non
    # produce nessun video dei due gruppi, quindi contarlo come primo giorno
    # vorrebbe dire chiudere la prova con un giorno di dati in meno di quelli
    # che le abbiamo promesso.
    inizio: "2026-08-22"

    # I due gruppi. Cambia SOLO il numero di curiosità: registro, tipografia,
    # musica, CTA e sorgenti restano identici. Una variabile alla volta.
    gruppi:
      corto:
        fatti: 1
        # 11,0 e non 16,0, e la differenza NON è un dettaglio.
        #
        # Lasciato al valore normale, `build_multi` darebbe a una curiosità
        # sola min(16, 33/1) = 16 secondi. Ma la rivelazione compare a 3,4s e
        # poi resta ferma fino alla fine: 12,6 secondi di frase immobile,
        # contro i 7,6 di oggi. Il gruppo corto arriverebbe alla prova con
        # dell'aria morta che il gruppo lungo non ha, perderebbe, e noi
        # concluderemmo «i video corti non funzionano» quando la risposta vera
        # sarebbe «sedici secondi su una frase sola non funzionano».
        #
        # A 11,0 il ritmo per curiosità è IDENTICO nei due gruppi (33/3 = 11).
        # L'unica cosa che cambia è quante ce ne sono, che è esattamente la
        # domanda della prova. Video finito: 11 + 2,4 = 13,4 secondi contro
        # 33 + 2,4 = 35,4 — due volte e mezzo, e i 35,4 tornano con la durata
        # ricavata dalle analytics dei 21 Short (33,1s di media, prima che la
        # coda esistesse). I 47 secondi sono il montaggio TikTok, che ha una
        # finestra sua: qui non c'entra.
        max_secondi_per_fatto: 11.0
        # «Which one was new to you?» con un fatto solo non vuol dire niente.
        domanda: "Did you know this one?"
      lungo:
        fatti: 3
        # Non vincola: con tre curiosità il calcolo dà già 33/3 = 11.
        max_secondi_per_fatto: 16.0
        domanda: "Which one was new to you?"

    # Ogni giorno i gruppi si scambiano l'orario di uscita. Senza, l'ora e la
    # lunghezza cambierebbero insieme e non sapremmo quale delle due leggiamo.
    #
    # Dal 21 agosto 2026 non ha più niente da fare: con una sola fascia
    # (`publish.youtube.orari`) l'indice è sempre 0 e non c'è nessuno scambio
    # da fare. Resta a true perché è la scelta giusta il giorno che le fasce
    # tornano due, e perché a una sola fascia il valore è inerte: metterlo a
    # false non cambierebbe un singolo video. Il confondimento con l'orario
    # adesso è risolto meglio, alla radice — c'è un orario solo, quindi tutti
    # i video di tutti e due i gruppi lo condividono.
    alterna_fascia: true

    # ─── LA REGOLA DI DECISIONE, SCRITTA PRIMA ───────────────────────────────
    # Sta qui e non nella testa di nessuno perché a fine mese la tentazione di
    # spostare l'asticella per far vincere l'ipotesi che ci piaceva è forte, e
    # una soglia scritta il primo giorno è l'unica difesa. Si legge SOLO al
    # giorno 60: guardare a metà e cambiare è il modo di trasformare il rumore
    # in una conclusione.
    #
    # metrica: viste per video, gruppo corto contro gruppo lungo
    #   corto avanti di ≥ 60%           → si adotta il formato a un fatto
    #   corto avanti fra 30% e 60%      → non conclusivo: si prolunga di 30 gg
    #   tutto il resto (incluso pari)   → si chiude, resta il formato a tre
    # In caso di dubbio non si cambia: il costo di restare è zero, quello di
    # inseguire un numero che era caso è un formato peggiore tenuto per mesi.
    soglia_adozione: 0.60
    soglia_proroga: 0.30

  # ─── PROVA SULL'APERTURA ───────────────────────────────────────────────────
  #
  # L'ipotesi: aprire con uno SCONTRO invece che con un DIVARIO.
  #
  #   divario   l'aggancio toglie qualcosa e chi guarda resta per vedere il
  #             buco riempito.  "The thing you're still cringing about?"
  #             È curiosità, ed è un sentimento tiepido.
  #   scontro   l'aggancio afferma una cosa che chi guarda crede falsa su di
  #             sé, e lui resta per vederla smontare.  "Your closest friend
  #             reads you worse than a stranger does."
  #             È obiezione, e tira in mezzo l'amor proprio.
  #
  # PERCHÉ QUESTA PROVA VALE PIÙ DELLE ALTRE DUE
  #
  # Non per intuizione: perché è l'unica delle tre idee che i nostri dati già
  # sostengono, ed è l'unica che sappiamo misurare bene. Misurato il 21 agosto
  # 2026 sui 22 Short con dati:
  #
  #                            mediana    intervallo      CV (rumore)
  #     tenuta a 3 secondi      0,923     0,823 – 0,977      0,049
  #     viste                     288        80 – 1278       0,781
  #
  # Sedici volte meno rumorosa. E non è silenziosa perché non conta niente:
  # correla con log(viste) a +0,32, più di qualunque altra cosa leggibile. La
  # metà dei video con tenuta migliore fa 533 viste mediane, l'altra metà 276.
  #
  # Il confronto col test sulla lunghezza è impietoso, e vale la pena averlo
  # scritto: quello poggia su una correlazione di +0,23 fra secondi guardati e
  # viste, e si giudica sulle viste, che hanno CV 0,78 — servono ~30 video per
  # gruppo per vedere una differenza del 60%. Questo si giudica su una misura
  # con CV 0,049: ne bastano ~15 per vedere una differenza del 5%.
  #
  # PERCHÉ TRE SECONDI E NON DUE O CINQUE
  #
  # Perché è esattamente la finestra in cui l'aggancio sta da solo sullo
  # schermo: `reel.reveal_at` vale 3,4. Prima di 3,4 secondi lo spettatore ha
  # visto SOLO la cosa che stiamo cambiando. Dopo ha visto anche la risposta,
  # il filmato, la musica, e la misura comincia a rispondere a una domanda
  # diversa da quella che le stiamo facendo.
  #
  # PERCHÉ GIRA INSIEME ALLA PROVA SULLA LUNGHEZZA
  #
  # Perché in un disegno fattoriale 2x2 non costa niente. L'effetto principale
  # di ciascun fattore si legge su TUTTI e 60 i video, non su 15: i corti e i
  # lunghi sono spartiti in parti uguali fra le due aperture, quindi sommando
  # si elidono. Solo l'INTERAZIONE — "lo scontro serve di più sui corti?" —
  # resta a 15 per casella, ed è la domanda a cui teniamo meno.
  # L'alternativa, due prove in fila, costerebbe due mesi invece di uno per
  # sapere le stesse due cose peggio.
  #
  # IL RISCHIO, che è reale e non formale
  #
  # Lo scontro è la scorciatoia più vicina alla bugia che questo account possa
  # prendere: un'affermazione è tanto più contestabile quanto più è estrema,
  # quindi chi scrive ha un incentivo strutturale a esagerare. Il blocco di
  # istruzioni in `engine/lines.py` spende metà del testo su cosa NON è uno
  # scontro proprio per questo. Se la prova la vince ma le frasi hanno smesso
  # di essere verificabili, abbiamo perso: tutto il valore di questa pagina è
  # che ogni riga regge un controllo.
  # Quindi al giorno 30 non si guarda solo il numero. Si rileggono dieci frasi
  # del gruppo scontro e si controlla che dicano ancora quello che gli studi
  # dicono. Un vantaggio del 5% non paga una frase falsa.
  apertura:
    attiva: true
    # 60 come la prova sulla lunghezza, e le due durate devono restare uguali:
    # girano sugli STESSI video, quindi chiuderne una prima vorrebbe dire
    # cambiare i prompt mentre l'altra e' ancora aperta, cioe' spostare una
    # variabile sotto i piedi di un esperimento in corso.
    #
    # Questa prova avrebbe retto anche a 30 giorni: a 15 video per braccio
    # becca un effetto da 5 punti l'89% delle volte contro il 96%, perche' la
    # tenuta a 3 secondi e' sedici volte meno rumorosa delle visualizzazioni
    # (CV 0,049 contro 0,781, misurato su 22 Short). E' la prova sulla
    # lunghezza a chiedere i 60 giorni. Questa li segue.
    giorni: 60
    inizio: "2026-08-22"
    alterna_fascia: true

    # LA REGOLA, scritta prima di vedere i dati.
    #
    # metrica: tenuta a 3 secondi, scontro contro divario
    #   scontro avanti di ≥ 3 punti percentuali  → si adotta ovunque
    #   scontro avanti fra 1 e 3 punti           → si prolunga di 30 giorni
    #   tutto il resto (incluso pari)            → si chiude, resta il divario
    #
    # Le soglie sono in PUNTI e non in percentuale della differenza perché la
    # tenuta è già una frazione: passare da 0,92 a 0,95 è "+3 punti", dirlo
    # come "+3,3%" inviterebbe a confonderlo con le percentuali di visione,
    # che sono un'altra cosa e stanno nella stessa tabella.
    #
    # Perché 3 punti e non 1: perché la deviazione misurata è 0,045, quindi
    # con 30 video per gruppo l'errore sulla media è circa 0,008. Tre punti
    # sono quasi quattro errori standard — una differenza che a quel punto è
    # difficile che sia caso. Un punto solo è dentro il rumore, ed è per
    # questo che è la soglia della proroga e non quella dell'adozione.
    soglia_adozione: 0.03
    soglia_proroga: 0.01

    # Cosa usano i canali CIECHI — Instagram e TikTok — mentre la prova gira.
    #
    # Su quei due non possiamo leggere niente, e non è un'opinione: verificato
    # il 21 agosto 2026 chiedendolo alle API.
    #   Instagram   reach, likes, comments, saved, shares, plays, views →
    #               400  "(#10) Application does not have permission"
    #   TikTok      video/list/ → 401  "scope_not_authorized"
    # Su Instagram non arrivano nemmeno i like.
    #
    # Quindi lì non si alterna. Dividere a metà un canale su cui non si legge
    # il risultato significa pagare il prezzo di una prova senza ricevere
    # l'informazione: metà delle uscite in una configurazione incerta, per
    # niente. La regola per un canale cieco è una sola — si usa sempre la
    # configurazione migliore fra quelle note.
    #
    # E c'è un secondo motivo, che è la ragione per cui questa prova dura 30
    # giorni e non 14: cambiare formato su tre canali insieme è esattamente ciò
    # che confonde gli algoritmi. YouTube porta l'incertezza per tutti.
    #
    # Il 21 settembre questo valore diventa "scontro" se la prova lo promuove.
    # È una riga sola perché è lo stesso generatore di frasi per tutti i canali.
    vincitore: "divario"

# ─── SITO ─────────────────────────────────────────────────────────────────────
# Una pagina per curiosità, servita da GitHub Pages: gratis, senza hosting e
# senza approvazioni. È l'unico prodotto che si accumula — un reel muore in due
# giorni, una pagina resta indicizzata per anni — e l'unico che nessuna
# piattaforma può spegnere.
sito:
  # Vuoto = si ricava dal repo (utente.github.io/nome-repo). Metti qui un
  # dominio tuo se ne compri uno: serve alle URL canoniche e alla sitemap,
  # e senza quelle Google indicizza l'indirizzo sbagliato.
  url: "https://oddlywired.github.io"

  # Repo dedicato al solo sito. Separato da quello del motore di proposito:
  # lì vivono il database, il CDN dei media e undici secret — e i secret non
  # si trasferiscono. Spostare tutto per avere un indirizzo più bello avrebbe
  # messo a rischio ciò che funziona; così invece è additivo, e se la
  # pubblicazione del sito fallisce il resto continua a girare.
  # Serve il secret SITE_TOKEN con permesso Contents: Read and write.
  repo: "oddlywired/oddlywired.github.io"

  # File scritti alla radice del sito, così come sono. Servono a dimostrare a
  # una piattaforma che il dominio è tuo: lei dà una stringa, tu la pubblichi
  # a un indirizzo preciso, lei va a leggerla. TikTok lo pretende prima di
  # accettare gli indirizzi di privacy, termini e ritorno OAuth.
  #
  # Perché qui e non a mano dentro docs/: docs/ si rigenera. Un file messo lì
  # a mano sopravvive finché non si fa pulizia, poi sparisce e la verifica
  # cade mesi dopo senza che nessuno colleghi le due cose.
  #
  # Il nome del file e il contenuto li dà la piattaforma: TikTok → la tua app
  # → URL properties → aggiungi oddlywired.github.io → scarica il file di
  # verifica, e qui va il nome esatto con dentro la stringa esatta.
  # Il nome del file NON è generico: TikTok lo lega alla stringa, quindi è
  # `tiktok<codice>.txt` e il contenuto ripete lo stesso codice. Va riprodotto
  # byte per byte — l'originale è 68 byte SENZA a capo finale, e `write_text`
  # non ne aggiunge. Un a capo di troppo qui è una verifica che fallisce senza
  # dire perché.
  file_radice:
    tiktokxDWsdLnQkxT2lh64aA83gVbxNUWSLObr.txt: "tiktok-developers-site-verification=xDWsdLnQkxT2lh64aA83gVbxNUWSLObr"

  # Misura del traffico. Vuoto = nessuno script, nessuna richiesta a terzi:
  # finché questo campo è vuoto le pagine restano identiche a prima.
  #
  # Il token si prende da Cloudflare → Web Analytics → Add a site, e si
  # incolla qui. Cloudflare e non Google Analytics per tre motivi concreti:
  # l'account c'è già (lo stesso che genera le immagini), è gratis senza
  # limiti di pagine viste, e non usa cookie — quindi niente banner di
  # consenso, che su un sito di poche pagine costerebbe più visite di quante
  # ne misuri. In cambio dà meno dettaglio di GA: pagine viste, provenienza,
  # paese e poco altro. Per sapere se il sito cresce basta.
  #
  # Misura le visite, non le ricerche. Per sapere COSA cerca chi arriva serve
  # Search Console, che è un'altra cosa e si attiva qui sotto.
  analytics: "16a38ffcca1943e784cac0e70824e66a"

  # Prova di proprietà per i motori di ricerca. Ogni voce diventa una <meta>
  # in testa a ogni pagina; le voci vuote non emettono niente.
  #
  # Perché serve, e in cosa differisce da `analytics`: Cloudflare conta CHI
  # arriva, Search Console dice CON QUALE RICERCA. Sono la stessa domanda
  # vista dai due lati, e la seconda è quella che dice cosa scrivere dopo — se
  # scopri che la gente arriva cercando "does the marshmallow test replicate",
  # quello è il prossimo capitolo, e non l'avresti indovinato.
  #
  # google-site-verification:
  #   search.google.com/search-console → Aggiungi proprietà → Prefisso URL
  #   → https://oddlywired.github.io → metodo "Tag HTML" → copia SOLO il
  #   valore di content=, non il tag intero. Poi `run.py sito` per pubblicare
  #   la meta, e solo dopo premi Verifica.
  #   Verificato: invia la sitemap /sitemap.xml (74 pagine).
  #
  # msvalidate.01 (facoltativo):
  #   bing.com/webmasters — si importa da Search Console in un clic. Vale la
  #   pena perché Bing alimenta anche DuckDuckGo e vari assistenti.
  verifica:
    google-site-verification: ""
    msvalidate.01: ""

# ─── EPISODIO LUNGO (YouTube) ─────────────────────────────────────────────────
# Settimanale, ~8 minuti, dieci curiosità legate da un tema.
#
# Perché esiste: gli Short portano visualizzazioni ma non iscritti — chi scorre
# non si affeziona a nove secondi. Chi guarda otto minuti ha già investito, e
# si iscrive. Sono due algoritmi separati con due funzioni diverse: gli Short
# fanno trovare la pagina, il formato lungo la fa seguire.
#
# Non consuma curiosità nuove: riusa quelle già uscite negli Short, che per il
# pubblico del formato lungo sono comunque inedite.
lungo:
  enabled: true

  # Voce della narrazione (Edge TTS: gratuita, senza chiave, neurale).
  # Scelta ascoltando sei voci maschili sullo stesso testo: l'accento
  # britannico su contenuto scientifico suona da documentario, che è il
  # registro della pagina. Valutate anche en-GB-ThomasNeural (più pacato),
  # en-US-BrianNeural (caldo), en-US-RogerNeural (maturo), en-US-EricNeural
  # (asciutto), en-AU-WilliamNeural. Si cambia qui, è una riga.
  voce: "en-GB-RyanNeural"

  # Rallentata di proposito: la cadenza predefinita di questi motori è da
  # notiziario, e su una pagina che si presenta come pacata suona sbagliata
  # prima ancora che si capisca cosa dice.
  velocita: "-8%"

  # Quante curiosità per episodio. Dieci per ~45 secondi l'una danno gli otto
  # minuti che servono a sbloccare le interruzioni pubblicitarie.
  curiosita: 10

  # La musica sta molto sotto la voce: qui non accompagna, riempie il silenzio
  # fra una frase e l'altra. Sopra 0.15 comincia a contendere il parlato.
  volume_musica: 0.10

  # Playlist in cui finiscono gli episodi. Un episodio isolato finisce quando
  # finisce e lo spettatore torna al feed generale; dentro una playlist YouTube
  # propone il successivo e la sessione resta sul canale. Il tempo di sessione
  # è uno dei segnali con cui YouTube decide chi spingere, ed è l'unico
  # migliorabile senza toccare il contenuto.
  playlist: "Oddly Wired — full episodes"
