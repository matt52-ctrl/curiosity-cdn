# Ciclo automatico su GitHub Actions.
#
# Perché qui e non sul Mac: gira sui server di GitHub, quindi pubblica anche a
# computer spento. 2000 minuti al mese gratis; questo ne consuma ~180.
#
# Lo stato vive in data/engine.db, che viene versionato: il disco del runner è
# effimero, quindi senza commit il sistema dimenticherebbe cosa ha pubblicato.

name: Curiosity cycle

on:
  schedule:
    # Spostati insieme ai reel nella finestra del pubblico anglofono. Erano
    # alle 11:00 e alle 17:00 italiane, cioe' le 5 del mattino e le 11 a New
    # York: avevo corretto i reel e lasciato indietro i caroselli.
    # Sfalsati dai reel (13, 19, 23) per non accavallarsi — condividono il
    # gruppo di concorrenza, quindi una sovrapposizione mette in coda.
    # Due avvertenze su questi orari.
    #
    # 1. Sono in UTC e non seguono l'ora legale: d'inverno i post escono
    #    un'ora prima in Italia.
    # 2. GitHub NON è puntuale. I job schedulati hanno priorità bassa e
    #    vengono accodati: il 10 agosto il giro delle 18:05 è partito alle
    #    19:09, con 64 minuti di ritardo. È normale e non aggirabile sul
    #    piano gratuito.
    #
    # Perciò l'orario è anticipato di 45 minuti rispetto alla finestra
    # desiderata (13:00 e 20:00 italiane): con il ritardo tipico si finisce
    # mediamente dentro. Se un giorno servisse precisione vera, l'unica
    # strada è un VPS con cron proprio.
    - cron: "15 12 * * *"    # ~15:00 italiane — 9:00 a New York
    - cron: "15 18 * * *"    # ~21:00 italiane — 15:00 a New York
  # Permette di lanciarlo a mano dalla tab Actions, utile per provare.
  workflow_dispatch:

# Serve a scrivere il database aggiornato nel repo.
permissions:
  contents: write

# Due esecuzioni sovrapposte scriverebbero sullo stesso database.
concurrency:
  group: curiosity-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Clone superficiale: questo repo è anche il CDN delle immagini e
          # cresce di ~6 MB a post. Senza, fra sei mesi ogni esecuzione
          # scaricherebbe centinaia di megabyte di storia inutile.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # I font non sono versionati: si riscaricano. Senza, Chromium ripiega sui
      # font di sistema e le slide escono con una tipografia diversa.
      - name: Scarica i font
        run: python setup_fonts.py

      - name: Esegui il ciclo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CDN_TOKEN }}
          GITHUB_REPO: ${{ secrets.CDN_REPO }}
          IMAGE_HOST_BACKEND: github
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py cycle

      # Il sito si rigenera a ogni giro: è statico, costa un secondo, e
      # rifarlo sempre evita di doversi ricordare quando serve. Le pagine
      # nuove finiscono nello stesso commit dello stato, quindi non c'è un
      # momento in cui il database conosce una curiosità e il sito no.
      - name: Rigenera il sito
        if: always()
        run: python run.py sito

      - name: Salva lo stato
        # `always()`: se il ciclo fallisce a metà, quello che ha già fatto va
        # comunque salvato, o al giro dopo lo rifarebbe da capo.
        if: always()
        run: |
          git config user.name  "curiosity-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/engine.db docs
          git diff --staged --quiet && exit 0
          git commit -m "stato: $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Durante il ciclo le immagini sono state caricate su questo stesso
          # repo via API, quindi il ramo remoto è avanti e un push diretto
          # verrebbe rifiutato. Si riprova più volte perché un salvataggio
          # perso significa ripubblicare al giro dopo ciò che è già uscito —
          # il guasto più costoso che questo sistema possa avere.
          for i in 1 2 3 4 5; do
            if git push; then echo "stato salvato"; exit 0; fi
            echo "push respinto, tentativo $i"
            git fetch origin main
            # NON si rebasa. `git rebase -X ours` sembra dire "vince la nostra
            # versione", ma durante un rebase "ours" è il ramo su cui si
            # rebasa — cioè il remoto: risolveva i conflitti buttando via
            # proprio il database appena scritto, in silenzio e senza errore.
            # È già costato una pubblicazione non registrata.
            #
            # Qui invece: l'indice torna al remoto (così le modifiche al
            # codice arrivate nel frattempo restano), i file di questo runner
            # non si toccano, e si ristagna solo lo stato. Il commit che ne
            # esce è il remoto più il nostro database, che è l'unico ad aver
            # registrato le pubblicazioni appena fatte.
            git reset -q origin/main
            git add data/engine.db docs
            if git diff --staged --quiet; then
              echo "nulla da salvare"; exit 0
            fi
            git commit -q -m "stato: $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep 5
          done
          echo "::error::stato NON salvato dopo 5 tentativi: rischio di ripubblicazione"
          exit 1
