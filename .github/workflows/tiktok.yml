# Bozze TikTok — prepara i video e li deposita nell'inbox dell'app.
#
# Perché serve un workflow e non basta TikTok Studio: il caricamento multiplo
# su Studio richiede 1.000 follower. Sotto quella soglia si trascina un file
# alla volta, e tredici video sono mezz'ora di lavoro manuale. Qui i video si
# montano e si caricano da soli; a Mattia resta un tocco per pubblicare.
#
# Le bozze NON escono da sole — è proprio questo a rendere superfluo l'audit
# di TikTok, che serve solo per la pubblicazione diretta e richiede settimane.

name: Curiosity TikTok

# ⚠️  SPENTO. Mattia ha deciso di non fare TikTok per ora — vedi in fondo.
#
# Il codice resta al suo posto e funziona: per riaccenderlo basta togliere il
# commento dagli orari qui sotto e mettere i tre secret TIKTOK_* su GitHub.
# Senza quei secret il caricamento fallirebbe a ogni giro mandando una mail,
# ed è il motivo per cui gli orari sono commentati invece che lasciati attivi.
#
# Perché è stato sospeso, in breve, per quando lo riprenderai:
#   · l'automazione COMPLETA su TikTok non è ottenibile gratis. L'audit del
#     nostro client è precluso (richiede schermate di consenso e l'avatar del
#     creator: la pipeline non ha interfaccia da mostrare), e i piani gratuiti
#     dei servizi terzi escludono TikTok proprio perché è il più costoso.
#   · a pagamento si può: Upload-Post Basic ~16 $/mese, oppure Blotato 29 $.
#   · ma Upload-Post stesso, nella propria documentazione, sconsiglia la
#     pubblicazione diretta: dice che pubblicare dall'app rende di più in
#     copertura organica. Pagare comprerebbe meno lavoro E meno copertura.
#
# Quindi la scelta è: o quattro tocchi al giorno sul telefono, o soldi con un
# probabile costo in copertura. Rivalutabile quando il canale avrà dei numeri.

on:
  workflow_dispatch:
    inputs:
      prova:
        description: "Prova a vuoto: monta i video ma non li carica"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # STESSO gruppo degli altri due workflow: scrivono tutti lo stesso database,
  # e due esecuzioni sovrapposte lo corromperebbero o perderebbero uno stato.
  group: curiosity-state
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 40      # un video da 45s, più l'eventuale generazione

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scarica font e musica
        run: |
          python setup_fonts.py
          python setup_music.py

      # Due passi separati di proposito: se il montaggio riesce ma il
      # caricamento fallisce (token scaduto, TikTok giù), i video restano
      # pronti e il giorno dopo partono senza rifare il lavoro.
      - name: Monta i video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # Uno per giro. Quattro giri al giorno restano sotto il tetto di
        # cinque bozze ogni 24 ore, con un margine per un recupero manuale.
        run: python run.py tiktok --quanti 1 --max-generazioni 1

      - name: Carica le bozze nell'inbox
        if: ${{ !inputs.prova }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py ttcarica --quanti 1

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name  "curiosity-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/engine.db
          git diff --staged --quiet && exit 0
          git commit -m "tiktok: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then echo "stato salvato"; exit 0; fi
            echo "push respinto, tentativo $i"
            git fetch origin main
            git rebase origin/main -X ours || {
              git rebase --abort
              git reset --soft origin/main
              git add data/engine.db
              git commit -m "tiktok: $(date -u '+%Y-%m-%d %H:%M UTC')"
            }
            sleep 5
          done
          echo "::error::stato NON salvato: rischio di ripubblicazione"
          exit 1
