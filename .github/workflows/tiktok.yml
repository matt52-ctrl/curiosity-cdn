# Bozze TikTok — prepara i video e li deposita nell'inbox dell'app.
#
# Perché serve un workflow e non basta TikTok Studio: il caricamento multiplo
# su Studio richiede 1.000 follower. Sotto quella soglia si trascina un file
# alla volta, e tredici video sono mezz'ora di lavoro manuale. Qui i video si
# montano e si caricano da soli; a Mattia resta un tocco per pubblicare.
#
# Le bozze NON escono da sole — è proprio questo a rendere superfluo l'audit
# di TikTok, che serve solo per la pubblicazione diretta e richiede settimane.

name: Curiosity TikTok

# Riacceso il 19 agosto 2026, dopo lo stop dell'11.
#
# Cosa NON è cambiato, e va tenuto a mente: la bozza non si pubblica da sola.
# L'endpoint inbox accetta solo i byte del video — nel corpo c'è `source_info`
# e non esiste alcun `post_info` — quindi titolo, descrizione e hashtag non
# sono allegabili. È TikTok a volerlo: è proprio quel pezzo lasciato all'utente
# a rendere superfluo l'audit di 2-4 settimane. Le due cose sono la stessa cosa
# vista da due lati, e nessuna quantità di codice le separa.
#
# Cosa è cambiato: la didascalia ora parte su Telegram nell'istante in cui la
# bozza arriva, dentro un blocco che sulle app si copia con un tocco. Restano
# due tocchi — apri la bozza, incolla, pubblica — invece dei quattro di prima,
# e soprattutto niente da scrivere e niente da cercare su un foglio.
#
# Se i tre secret TIKTOK_* non ci sono ancora, questo workflow NON fallisce:
# `ttcarica` riconosce le credenziali assenti e esce a zero. Gli orari si
# possono quindi accendere prima di registrare l'app sviluppatore, senza
# ricevere una mail di errore ogni notte.

on:
  # ORARI ACCESI il 20 agosto 2026, dopo la prima bozza arrivata davvero
  # nell'app (publish_id v_inbox_file~v2.7676…, stato SEND_TO_USER_INBOX).
  #
  # Restavano fermi perché montare CONSUMA: `segna_uso_fatto(..., "tiktok",
  # ...)` marca ogni curiosità come già uscita, quindi orari accesi senza app
  # collegata bruciavano materiale per video non spedibili — il danno di
  # agosto, moltiplicato per quattro. Adesso non serve più tenerli fermi:
  # `cmd_tiktok` chiede il token PRIMA di montare e, se manca, esce a zero
  # senza toccare niente. Il guardrail sta nel codice, non nella prudenza di
  # chi si ricorda di non accendere l'interruttore.
  schedule:
    # Quattro giri al giorno, uno per bozza, sotto il tetto TikTok di cinque
    # ogni 24 ore — il quinto posto resta libero per un recupero a mano.
    #
    # Gli orari sono in UTC e anticipati di 45 minuti come negli altri
    # workflow, perché GitHub accoda i job schedulati e parte in ritardo
    # (misurato fino a 64 minuti).
    #
    # Le fasce seguono lo stesso ragionamento sui fusi già applicato ai reel:
    # il canale è in inglese e pesca da Stati Uniti e Regno Unito, quindi la
    # finestra utile in ora italiana va dal pomeriggio all'una di notte.
    # Diversamente dai reel, qui l'orario del job NON è l'orario di uscita:
    # deposita solo la bozza, e a pubblicare sei tu quando la vedi. Contano
    # perciò gli orari in cui hai il telefono in mano, non quelli di TikTok.
    - cron: "15 6 * * *"     # ~9:00 italiane — la bozza ti aspetta al risveglio
    - cron: "15 10 * * *"    # ~13:00 italiane — pausa pranzo
    # Le 17:15 e non le 16:15: a quell'ora gira il ciclo dei reel, che
    # condivide il gruppo di concorrenza `curiosity-state`. Due giri dello
    # stesso gruppo in coda insieme non si accodano educatamente — GitHub
    # ne tiene uno solo in attesa e ANNULLA l'altro. È successo il 19
    # agosto e costò la giornata YouTube.
    - cron: "15 17 * * *"    # ~19:15 italiane — sera Europa, pomeriggio USA
    - cron: "15 20 * * *"    # ~23:00 italiane — sera piena negli Stati Uniti
  workflow_dispatch:
    inputs:
      prova:
        description: "Prova a vuoto: monta i video ma non li carica"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # STESSO gruppo degli altri due workflow: scrivono tutti lo stesso database,
  # e due esecuzioni sovrapposte lo corromperebbero o perderebbero uno stato.
  group: curiosity-state
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 40      # un video da 45s, più l'eventuale generazione

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          # Il browser SERVE: reel.py importa `render` dentro alle funzioni
          # (engine/reel.py:386) e render_slides apre Chromium per trasformare
          # l'HTML delle schede in PNG. Il 20 agosto l'ho tolto sbagliando —
          # avevo controllato solo gli import in cima ai file — e i giri sono
          # morti con "Executable doesn't exist at .cache/ms-playwright".
          #
          # Resta però il tetto qui sopra: il 19 agosto questo stesso comando
          # si era impiantato 45 minuti sull'apt-get delle librerie di sistema,
          # mangiandosi l'intero job. Con `timeout-minutes` muore il passo e
          # non la giornata, e il giro dopo ritenta.
          playwright install --with-deps chromium

      - name: Scarica font e musica
        run: |
          python setup_fonts.py
          python setup_music.py

      # Due passi separati di proposito: se il montaggio riesce ma il
      # caricamento fallisce (token scaduto, TikTok giù), i video restano
      # pronti e il giorno dopo partono senza rifare il lavoro.
      - name: Monta i video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Servono ANCHE qui, non solo al passo che carica: da oggi il
          # montaggio chiede il token prima di consumare una curiosità, e
          # senza questi tre vedrebbe credenziali assenti e non monterebbe
          # mai niente.
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        # Uno per giro. Quattro giri al giorno restano sotto il tetto di
        # cinque bozze ogni 24 ore, con un margine per un recupero manuale.
        run: python run.py tiktok --quanti 1 --max-generazioni 1

      - name: Carica le bozze nell'inbox
        if: ${{ !inputs.prova }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py ttcarica --quanti 1

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name  "curiosity-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/engine.db
          git diff --staged --quiet && exit 0
          git commit -m "tiktok: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then echo "stato salvato"; exit 0; fi
            echo "push respinto, tentativo $i"
            git fetch origin main
            git rebase origin/main -X ours || {
              git rebase --abort
              git reset --soft origin/main
              git add data/engine.db
              git commit -m "tiktok: $(date -u '+%Y-%m-%d %H:%M UTC')"
            }
            sleep 5
          done
          echo "::error::stato NON salvato: rischio di ripubblicazione"
          exit 1
