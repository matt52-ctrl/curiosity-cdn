# Bozze TikTok — prepara i video e li deposita nell'inbox dell'app.
#
# Perché serve un workflow e non basta TikTok Studio: il caricamento multiplo
# su Studio richiede 1.000 follower. Sotto quella soglia si trascina un file
# alla volta, e tredici video sono mezz'ora di lavoro manuale. Qui i video si
# montano e si caricano da soli; a Mattia resta un tocco per pubblicare.
#
# Le bozze NON escono da sole — è proprio questo a rendere superfluo l'audit
# di TikTok, che serve solo per la pubblicazione diretta e richiede settimane.

name: Curiosity TikTok

on:
  schedule:
    # ~7:30 italiane. Presto di proposito: le cinque bozze devono essere già
    # nell'inbox quando Mattia guarda il telefono la mattina, così le pubblica
    # nell'arco della giornata invece di trovarle a sera.
    - cron: "45 4 * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Prova a vuoto: monta i video ma non li carica"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # STESSO gruppo degli altri due workflow: scrivono tutti lo stesso database,
  # e due esecuzioni sovrapposte lo corromperebbero o perderebbero uno stato.
  group: curiosity-state
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # montare cinque video da 45s è lento

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scarica font e musica
        run: |
          python setup_fonts.py
          python setup_music.py

      # Due passi separati di proposito: se il montaggio riesce ma il
      # caricamento fallisce (token scaduto, TikTok giù), i video restano
      # pronti e il giorno dopo partono senza rifare il lavoro.
      - name: Monta i video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # Cinque al giorno è il tetto di TikTok: montarne di più sarebbe
        # lavoro sprecato, perché resterebbero in coda invecchiando.
        run: python run.py tiktok --quanti 5 --max-generazioni 2

      - name: Carica le bozze nell'inbox
        if: ${{ !inputs.prova }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py ttcarica

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name  "curiosity-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/engine.db
          git diff --staged --quiet && exit 0
          git commit -m "tiktok: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then echo "stato salvato"; exit 0; fi
            echo "push respinto, tentativo $i"
            git fetch origin main
            git rebase origin/main -X ours || {
              git rebase --abort
              git reset --soft origin/main
              git add data/engine.db
              git commit -m "tiktok: $(date -u '+%Y-%m-%d %H:%M UTC')"
            }
            sleep 5
          done
          echo "::error::stato NON salvato: rischio di ripubblicazione"
          exit 1
