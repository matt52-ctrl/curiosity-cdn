# Ciclo dei Reel — deliberatamente separato da quello dei caroselli.
#
# Perché due workflow e non uno: i due formati falliscono in modi diversi.
# I reel dipendono da ffmpeg, da Pexels e da un caricamento video molto più
# lento; i caroselli no. Tenendoli separati, un guasto sui video non impedisce
# ai caroselli di uscire, e viceversa — che è esattamente il requisito.

name: Curiosity reels

on:
  schedule:
    # Orari italiani desiderati: 13:00, 19:00, 23:00.
    # Sono in UTC (d'estate Italia = UTC+2) e anticipati, perché GitHub accoda
    # i job schedulati e parte in ritardo. ⚠️ Il "fino a 64 minuti" scritto qui
    # per settimane era una misura vecchia: al 4 settembre 2026 il ritardo
    # vero e' fra 162 e 272 minuti — vedi la nota sul primo cron piu' sotto.
    #
    # Perché queste tre e non le 8:00/12:00/20:00 di prima: il canale è in
    # inglese, e su Shorts l'inglese pesca soprattutto da Stati Uniti e Regno
    # Unito. Le 7:15 italiane sono l'1:15 a New York e le 11:15 sono le 5:15 —
    # due uscite su tre finivano nel cuore della notte del pubblico principale.
    # La finestra utile, in ora italiana, è dalle 18 all'1: copre insieme il
    # pomeriggio-sera americano e la sera europea.
    #
    # Riscontro sui primi cinque video: le due uscite di mezzogiorno hanno
    # fatto 115 e 117 visualizzazioni, quella delle 19:45 ne ha fatte 497.
    # Con cinque video non si distingue l'orario dal contenuto — quel video
    # aveva anche l'aggancio migliore — ma punta nella stessa direzione del
    # ragionamento sui fusi, che regge da solo.
    # Gli Short non escono più quando parte il job: vengono caricati tutti e
    # tre qui e programmati su YouTube per le 13:00, 19:00 e 23:00 italiane
    # (publish.youtube.orari). Questo giro non tocca Instagram — i reel non si
    # possono programmare e alle 9:45 italiane sarebbero fuori dalla finestra
    # scelta. Il margine sulla prima fascia va tenuto largo, perché GitHub
    # parte in ritardo di ore e non di minuti.
    #
    # RIDOTTO il 19 agosto 2026: da quattro giri a due, cioè da tre reel e tre
    # Short al giorno a uno e uno. Prova a tempo, decisa guardando che il
    # canale non ha ancora pubblico: con tre video al giorno ognuno viene
    # provato su un campione piccolo e i tre si tolgono spazio a vicenda,
    # mentre con uno solo la spinta si concentra e la differenza fra un
    # aggancio buono e uno mediocre si legge invece di sparire nella media.
    #
    # Gli altri due orari restano scritti qui sotto, commentati, perché
    # rimetterli è la cosa più probabile che si voglia fare fra due settimane.
    #
    # 21 agosto 2026 — i cron NON cambiano, ma da oggi il giro delle 9:45
    # carica DUE Short invece di uno: `publish.youtube.orari` è tornato a due
    # fasce (13:00 e 19:00) per la prova sulla lunghezza. Un solo giro basta
    # perché programma tutte le fasce del giorno ancora scoperte, e alle 9:45
    # lo sono entrambe. Il giro delle 18:15 resta la rete di sicurezza: se il
    # mattino salta, recupera almeno le 19:00.
    # ANTICIPATO a 1:15 UTC il 4 settembre 2026, ed e' una correzione, non un
    # cambio di strategia. Il ritardo dello scheduler di GitHub qui sopra e'
    # scritto come "misurato fino a 64 minuti": era vero quando fu misurato,
    # non lo e' piu'. Rilevato su sei giri consecutivi, con `created_at`
    # identico a `run_started_at` — quindi e' lo scheduler, non la coda dei
    # runner:
    #
    #     cron 07:45  parte 12:15, 12:16, 12:17   (+270, +271, +272 minuti)
    #     cron 16:15  parte 18:57, 19:16, 19:21   (+162, +181, +186 minuti)
    #
    # Cosa costava. Il giro del mattino arrivava alle 14:15 italiane, e a
    # quell'ora la fascia delle 11:00 e' passata da tre ore: `_fasce_da_coprire`
    # la scarta per il margine dei dieci minuti e resta solo quella delle
    # 23:00. Da qui UNO Short al giorno invece di due, dal 3 settembre, con
    # `max_per_day: 2` e due orari in configurazione che sembravano rispettati.
    # Si vede nei fatti: gli ultimi otto Short sono tutti caricati fra le 14:18
    # e le 14:48 e programmati tutti per una fascia sola.
    #
    # Perche' anticipare non costa niente: da quando gli Short si PROGRAMMANO,
    # l'ora del giro non e' l'ora di uscita. Un giro che parte alle 4 del
    # mattino carica gli stessi due video e li mette alle 11:00 e alle 23:00
    # esattamente come uno che parte alle 9. L'unico requisito e' arrivare
    # prima della prima fascia, e con +270 minuti l'1:15 arriva alle 5:45 UTC
    # (7:45 italiane) nel caso peggiore misurato.
    #
    # L'ora 1 e' libera da altri workflow: il piu' vicino e' capitoli alle
    # 3:15, che condivide il gruppo di concorrenza `curiosity-state`.
    - cron: "15 1 * * *"     # carica e programma i due Short della giornata
    - cron: "15 16 * * *"    # ~19:00 italiane — sera Europa, pomeriggio USA
    # - cron: "15 10 * * *"    # ~13:00 italiane — pranzo in Europa, mattina in USA
    # - cron: "15 20 * * *"    # ~23:00 italiane — sera piena negli Stati Uniti
  workflow_dispatch:
    inputs:
      prova:
        description: "Prova a vuoto: costruisce tutto ma non pubblica"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # STESSO gruppo del workflow dei caroselli, di proposito: i due scrivono lo
  # stesso database, e due esecuzioni sovrapposte lo corromperebbero o
  # perderebbero uno dei due stati. Qui la separazione va sospesa.
  group: curiosity-state
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 45      # il montaggio video e l'upload sono lenti

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        # Un tetto suo, molto sotto quello del job: se l'installazione si
        # impianta deve morire lei e lasciare il tempo al resto, non mangiarsi
        # i 45 minuti interi e portarsi giù la giornata.
        timeout-minutes: 12
        run: |
          # ffmpeg non è garantito sull'immagine del runner e serve solo qui.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          # Il browser SERVE: reel.py importa `render` dentro alle funzioni
          # (engine/reel.py:386) e render_slides apre Chromium per trasformare
          # l'HTML delle schede in PNG. Il 20 agosto l'ho tolto sbagliando —
          # avevo controllato solo gli import in cima ai file — e i giri sono
          # morti con "Executable doesn't exist at .cache/ms-playwright".
          #
          # Resta però il tetto qui sopra: il 19 agosto questo stesso comando
          # si era impiantato 45 minuti sull'apt-get delle librerie di sistema,
          # mangiandosi l'intero job. Con `timeout-minutes` muore il passo e
          # non la giornata, e il giro dopo ritenta.
          playwright install --with-deps chromium

      - name: Scarica font e musica
        run: |
          python setup_fonts.py
          python setup_music.py

      - name: Esegui il ciclo reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CDN_TOKEN }}
          GITHUB_REPO: ${{ secrets.CDN_REPO }}
          IMAGE_HOST_BACKEND: github
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Sola lettura dell'analitica: serve a engine/neuroni.py per sapere
          # quanti neuroni restano prima di generare. Senza, il guardiano non
          # puo' misurare, lascia passare tutto e si torna a scoprire la quota
          # finita dal 429 — cioe' da immagini che peggiorano in silenzio.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          # La GPU gratuita per l'apertura animata. Se il secret non c'e' il
          # giro NON fallisce: `animazione.anima` ritorna None e lo sfondo
          # torna a essere il filmato in tema, come prima che esistesse.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Senza questi, con publish.youtube.enabled a true il caricamento
          # fallirebbe a ogni giro con un errore di credenziali mancanti.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # Il giro delle 7:45 è l'unico che programma gli Short e l'unico che
        # non pubblica su Instagram. Gli altri tre trovano le fasce già
        # coperte e non ricaricano nulla — restano la rete di sicurezza se
        # questo fallisce.
        # Su una riga sola: con le continuazioni, un'espansione vuota lascia una
        # riga di soli spazi e un backslash, e basta uno spazio di troppo dopo
        # il backslash perché il comando si spezzi in due.
        run: python run.py reels ${{ inputs.prova && '--no-publish' || '' }} ${{ github.event.schedule == '45 7 * * *' && '--solo-youtube' || '' }}

      # I commenti girano in coda alla pubblicazione, non in un workflow loro:
      # rispondere entro la prima ora è ciò che conta, e la prima ora è questa.
      #
      # Niente `continue-on-error`, di proposito. Il comando esce già a zero
      # sui casi previsti — permesso mancante, nessun commento nuovo, quota —
      # quindi se esce in errore ha incontrato qualcosa che non si risolve da
      # sé, e la mail di GitHub sul workflow fallito è l'unico modo di
      # accorgersene. Lo stato viene salvato comunque: il passo dopo è
      # `if: always()`, quindi un rosso qui non perde una pubblicazione.
      - name: Rispondi ai commenti
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CDN_TOKEN }}
          GITHUB_REPO: ${{ secrets.CDN_REPO }}
          IMAGE_HOST_BACKEND: github
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Sola lettura dell'analitica: serve a engine/neuroni.py per sapere
          # quanti neuroni restano prima di generare. Senza, il guardiano non
          # puo' misurare, lascia passare tutto e si torna a scoprire la quota
          # finita dal 429 — cioe' da immagini che peggiorano in silenzio.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          # La GPU gratuita per l'apertura animata. Se il secret non c'e' il
          # giro NON fallisce: `animazione.anima` ritorna None e lo sfondo
          # torna a essere il filmato in tema, come prima che esistesse.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Senza questi, con publish.youtube.enabled a true il caricamento
          # fallirebbe a ogni giro con un errore di credenziali mancanti.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python run.py comments

      # Il sito si rigenera a ogni giro: è statico, costa un secondo, e
      # rifarlo sempre evita di doversi ricordare quando serve. Le pagine
      # nuove finiscono nello stesso commit dello stato, quindi non c'è un
      # momento in cui il database conosce una curiosità e il sito no.
      - name: Rigenera il sito e pubblicalo
        if: always()
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        # Se il token manca o la pubblicazione fallisce, il comando lo dice e
        # basta: il sito resta indietro di un giro, ma la pipeline non si
        # ferma. È il motivo per cui il sito sta in un repo suo.
        run: python run.py sito --pubblica

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name  "curiosity-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/engine.db data/footage_usate.json
          git diff --staged --quiet && exit 0
          git commit -m "reel: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then echo "stato salvato"; exit 0; fi
            echo "push respinto, tentativo $i"
            git fetch origin main
            # NON si rebasa. `git rebase -X ours` sembra dire "vince la nostra
            # versione", ma durante un rebase "ours" è il ramo su cui si
            # rebasa — cioè il remoto: risolveva i conflitti buttando via
            # proprio il database appena scritto, in silenzio e senza errore.
            # È già costato una pubblicazione non registrata.
            #
            # Qui invece: l'indice torna al remoto (così le modifiche al
            # codice arrivate nel frattempo restano), i file di questo runner
            # non si toccano, e si ristagna solo lo stato. Il commit che ne
            # esce è il remoto più il nostro database, che è l'unico ad aver
            # registrato le pubblicazioni appena fatte.
            git reset -q origin/main
            git add data/engine.db data/footage_usate.json
            if git diff --staged --quiet; then
              echo "nulla da salvare"; exit 0
            fi
            git commit -q -m "reel: $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep 5
          done
          echo "::error::stato NON salvato: rischio di ripubblicazione"
          exit 1
